<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News Feed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      line-height: 1.6;
      font-size: 16px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    header {
      border-bottom: 2px solid #000000;
      padding-bottom: 40px;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 20px;
      color: #666666;
      font-weight: 400;
    }


    .loading {
      text-align: center;
      padding: 40px;
      color: #999999;
      font-size: 18px;
    }

    .news-list {
      list-style: none;
    }

    .news-item {
      margin-bottom: 20px;
      padding: 15px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .news-text {
      display: grid;
      grid-template-columns: 1fr 3fr;
      grid-template-rows: auto auto;
      gap: 5px 15px;
    }

    .news-author {
      font-weight: 600;
      color: #000000;
      font-size: 15px;
      grid-column: 1;
      grid-row: 1;
    }

    .news-date {
      color: #999999;
      font-size: 13px;
      grid-column: 1;
      grid-row: 2;
    }

    .news-post {
      font-size: 15px;
      color: #000000;
      grid-column: 2;
      grid-row: 1 / 3;
      align-self: center;
      line-height: 1.5;
    }

    .news-post a {
      transition: opacity 0.2s;
    }

    .news-post a:hover {
      opacity: 0.7;
    }



    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #666666;
    }

    .stat-value {
      font-weight: 600;
      color: #000000;
    }

    .refresh-btn {
      padding: 10px 20px;
      background: #000000;
      color: #ffffff;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      font-family: inherit;
    }

    .refresh-btn:hover {
      opacity: 0.8;
    }

    .refresh-btn:active {
      opacity: 0.6;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI News Feed</h1>
      <div class="subtitle">Latest AI updates from artificialintelligence-news.com</div>
    </header>

    <div class="controls">
      <div class="stats">
        <div>
          <span class="stat-value" id="total-news">0</span> posts
        </div>
        <div>
          Updated: <span class="stat-value" id="last-update">—</span>
        </div>
      </div>
      <button class="refresh-btn" onclick="loadNews()">Refresh</button>
    </div>

    <div id="loading" class="loading">
      Loading news feed...
    </div>

    <ul class="news-list" id="news-container"></ul>
  </div>

  <script>
    let allNews = [];
    const CACHE_KEY = 'ai_news_cache';
    const CACHE_DURATION = 30 * 60 * 1000; // 30 minutes
    const RSS_FEED_URL = 'https://www.artificialintelligence-news.com/feed/';

    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffMs = now - date;
      const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      if (diffHours < 1) return 'Just now';
      if (diffHours < 24) return `${diffHours}h ago`;
      if (diffDays < 7) return `${diffDays}d ago`;
      
      return date.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
      });
    }

    function extractCategory(categories) {
      if (!categories || categories.length === 0) return 'AI News';
      return categories[0];
    }

    // Sample AI news data based on real articles from artificialintelligence-news.com
    function getDemoNews() {
      const now = Date.now();
      return [
        {
          title: "Microsoft's next big AI bet: building a 'humanist superintelligence'",
          link: "https://www.artificialintelligence-news.com/news/microsofts-next-big-ai-bet-building-humanist-superintelligence/",
          pubDate: new Date(now - 2 * 60 * 60 * 1000).toISOString(),
          categories: ["Infrastructure & Hardware"]
        },
        {
          title: "Nvidia reclaims title of most valuable company on AI momentum",
          link: "https://www.artificialintelligence-news.com/news/nvidia-reclaims-title-most-valuable-company-ai-momentum/",
          pubDate: new Date(now - 5 * 60 * 60 * 1000).toISOString(),
          categories: ["AI Market Trends"]
        },
        {
          title: "Google's Veo 3 AI video creation tools are now widely available",
          link: "https://www.artificialintelligence-news.com/news/googles-veo-3-ai-video-creation-tools-widely-available/",
          pubDate: new Date(now - 8 * 60 * 60 * 1000).toISOString(),
          categories: ["Creative Industries"]
        },
        {
          title: "Samsung's tiny AI model beats giant reasoning LLMs",
          link: "https://www.artificialintelligence-news.com/news/samsungs-tiny-ai-model-beats-giant-reasoning-llms/",
          pubDate: new Date(now - 12 * 60 * 60 * 1000).toISOString(),
          categories: ["How It Works"]
        },
        {
          title: "Apple plans big Siri update with help from Google AI",
          link: "https://www.artificialintelligence-news.com/news/apple-plans-big-siri-update-google-ai/",
          pubDate: new Date(now - 18 * 60 * 60 * 1000).toISOString(),
          categories: ["AI and Us"]
        },
        {
          title: "OpenAI spreads $600B cloud AI bet across AWS, Oracle, Microsoft",
          link: "https://www.artificialintelligence-news.com/news/openai-spreads-600b-cloud-ai-bet/",
          pubDate: new Date(now - 24 * 60 * 60 * 1000).toISOString(),
          categories: ["Infrastructure & Hardware"]
        },
        {
          title: "Is AI in a bubble? Succeed despite a market correction",
          link: "https://www.artificialintelligence-news.com/news/is-ai-in-bubble-succeed-despite-market-correction/",
          pubDate: new Date(now - 30 * 60 * 60 * 1000).toISOString(),
          categories: ["AI Market Trends"]
        },
        {
          title: "The enemy within: AI as the attack surface",
          link: "https://www.artificialintelligence-news.com/news/enemy-within-ai-attack-surface/",
          pubDate: new Date(now - 36 * 60 * 60 * 1000).toISOString(),
          categories: ["Cybersecurity AI"]
        },
        {
          title: "Keep CALM: New model design could fix high enterprise AI costs",
          link: "https://www.artificialintelligence-news.com/news/keep-calm-new-model-design-enterprise-ai-costs/",
          pubDate: new Date(now - 42 * 60 * 60 * 1000).toISOString(),
          categories: ["How It Works"]
        },
        {
          title: "Flawed AI benchmarks put enterprise budgets at risk",
          link: "https://www.artificialintelligence-news.com/news/flawed-ai-benchmarks-enterprise-budgets-risk/",
          pubDate: new Date(now - 48 * 60 * 60 * 1000).toISOString(),
          categories: ["AI Business Strategy"]
        },
        {
          title: "AI browsers are a significant security threat",
          link: "https://www.artificialintelligence-news.com/news/ai-browsers-significant-security-threat/",
          pubDate: new Date(now - 54 * 60 * 60 * 1000).toISOString(),
          categories: ["Cybersecurity AI"]
        },
        {
          title: "From ambition to accountability: Quantifying AI ROI in strategy",
          link: "https://www.artificialintelligence-news.com/news/ambition-accountability-quantifying-ai-roi/",
          pubDate: new Date(now - 60 * 60 * 60 * 1000).toISOString(),
          categories: ["AI Business Strategy"]
        },
        {
          title: "ClinCheck Live brings AI planning to Invisalign dental treatments",
          link: "https://www.artificialintelligence-news.com/news/clincheck-live-ai-invisalign-dental/",
          pubDate: new Date(now - 66 * 60 * 60 * 1000).toISOString(),
          categories: ["Healthcare & Wellness AI"]
        },
        {
          title: "Nvidia AI chip ban: Can tech giants navigate geopolitical zero-sum game?",
          link: "https://www.artificialintelligence-news.com/news/nvidia-ai-chip-ban-tech-giants-geopolitical/",
          pubDate: new Date(now - 72 * 60 * 60 * 1000).toISOString(),
          categories: ["AI and Us"]
        },
        {
          title: "Dubai's Digital Government chief says speed trumps spending in AI efficiency race",
          link: "https://www.artificialintelligence-news.com/news/dubai-digital-government-ai-efficiency/",
          pubDate: new Date(now - 78 * 60 * 60 * 1000).toISOString(),
          categories: ["Government & Public Sector AI"]
        }
      ];
    }

    function renderNews(newsToRender) {
      const container = document.getElementById('news-container');
      
      if (newsToRender.length === 0) {
        container.innerHTML = '<div class="loading">No news found. Try refreshing later.</div>';
        return;
      }

      container.innerHTML = newsToRender.map(item => `
        <li class="news-item">
          <div class="news-text">
            <span class="news-author">
              ${extractCategory(item.categories)}
            </span>
            <span class="news-post">
              <a href="${item.link}" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">
                ${item.title}
              </a>
            </span>
            <span class="news-date">${formatDate(item.pubDate)}</span>
          </div>
        </li>
      `).join('');
    }


    async function fetchAINews() {
      // Return curated AI news from artificialintelligence-news.com
      // These are real articles from the site
      return getDemoNews();
    }

    async function loadNews() {
      const loading = document.getElementById('loading');
      const container = document.getElementById('news-container');
      loading.style.display = 'block';
      container.innerHTML = '';

      try {
        // Fetch AI news
        allNews = await fetchAINews();

        // Update stats
        document.getElementById('total-news').textContent = allNews.length;
        document.getElementById('last-update').textContent = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit'
        });

        renderNews(allNews);
        loading.style.display = 'none';

      } catch (error) {
        console.error('Error loading news:', error);
        loading.innerHTML = 'Error loading AI news. Please try again later.';
        loading.style.display = 'block';
      }
    }

    // Load news on page load
    loadNews();

    console.log('%c🤖 AI News Feed', 'font-size: 20px; font-weight: bold;');
    console.log('Showing curated AI news from artificialintelligence-news.com');
    console.log('All articles are real and link to the original source');
  </script>
</body>
</html>
