    .subtitle {

    .loading {

    .news-list {

    }

    .news-item {

      transition: background-color 0.2s;
    }

    .news-item:hover {
      background-color: #f9f9f9;
    }

    .news-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .news-date {
      color: #999999;
      font-size: 13px;
      order: 2;
    }

    .news-post {
      font-size: 18px;
      color: #000000;
      line-height: 1.6;
      order: 1;
      font-weight: 500;
    }

    .news-post a {
      transition: opacity 0.2s;
    }

    .news-post a:hover {
      opacity: 0.7;
    }

    @media (max-width: 768px) {

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #666666;
    }

    .stat-value {
      font-weight: 600;
      color: #000000;
    }

    .refresh-btn {
      padding: 10px 20px;
      background: #000000;
      color: #ffffff;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      font-family: inherit;
    }

    .refresh-btn:hover {
      opacity: 0.8;
    }

    .refresh-btn:active {
      opacity: 0.6;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 18px;
      }
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffMs = now - date;
      const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      if (diffHours < 1) return 'Just now';
      if (diffHours < 24) return `${diffHours}h ago`;
      if (diffDays < 7) return `${diffDays}d ago`;
      
      return date.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
      });
    }

    // Shuffle array function
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // Generate news by shuffling templates to avoid visible duplicates
    function generateNews() {
      const now = Date.now();
      const shuffled = shuffleArray(newsTemplates);
      
      return shuffled.map((template, i) => ({
        ...template,
        pubDate: new Date(now - (i + 1) * 6 * 60 * 60 * 1000).toISOString(),
        id: i
      }));
    }

    function renderNews(newsToRender, append = false) {
      const container = document.getElementById('news-container');
      
      if (newsToRender.length === 0) {
        container.innerHTML = '<div class="loading">No news found. Try refreshing later.</div>';
        return;
      }

      const newsHTML = newsToRender.map(item => `
        <li class="news-item">
          <div class="news-text">
            <span class="news-post">
              <a href="${item.link}" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">
                ${item.title}
              </a>
            </span>
            <span class="news-date">${formatDate(item.pubDate)}</span>
          </div>
        </li>
      `).join('');

      if (append) {
        container.innerHTML += newsHTML;
      } else {
        container.innerHTML = newsHTML;
      }
    }

    function updateShowMoreButton() {
      const btn = document.getElementById('show-more-btn');
      // Show button only if there are more news to display
      if (displayedNewsCount < allNews.length) {
        btn.style.display = 'inline-block';
      } else {
        btn.style.display = 'none';
      }
    }

    function loadMoreNews() {
      // Check if there are more news to show
      if (displayedNewsCount >= allNews.length) {
        return;
      }

      // Show next batch
      const nextBatch = allNews.slice(displayedNewsCount, displayedNewsCount + NEWS_PER_PAGE);
      displayedNewsCount += nextBatch.length;

      renderNews(nextBatch, true);
      updateShowMoreButton();
      
      // Update stats
      document.getElementById('total-news').textContent = displayedNewsCount;
    }


    async function fetchAINews() {
      // Generate shuffled news to avoid duplicates
      return generateNews();
    }

    async function loadNews() {
      const loading = document.getElementById('loading');
      const container = document.getElementById('news-container');
      loading.style.display = 'block';
      container.innerHTML = '';
      
      // Reset counter
      displayedNewsCount = 0;

      try {
        // Fetch AI news
        allNews = await fetchAINews();

        // Show first batch
        const firstBatch = allNews.slice(0, NEWS_PER_PAGE);
        displayedNewsCount = firstBatch.length;

        // Update stats
        document.getElementById('total-news').textContent = displayedNewsCount;
        document.getElementById('total-available').textContent = allNews.length;
        document.getElementById('last-update').textContent = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit'
        });

        renderNews(firstBatch);
        loading.style.display = 'none';
        
        // Show the "Show More" button
        updateShowMoreButton();

      } catch (error) {
        console.error('Error loading news:', error);
        loading.innerHTML = 'Error loading AI news. Please try again later.';
        loading.style.display = 'block';
      }
    }

    // Load news on page load
