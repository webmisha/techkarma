<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News Feed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      line-height: 1.6;
      font-size: 16px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    header {
      border-bottom: 2px solid #000000;
      padding-bottom: 40px;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 20px;
      color: #666666;
      font-weight: 400;
    }


    .loading {
      text-align: center;
      padding: 40px;
      color: #999999;
      font-size: 18px;
    }

    .news-list {
      list-style: none;
    }

    .news-item {
      margin-bottom: 20px;
      padding: 15px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .news-text {
      display: grid;
      grid-template-columns: 1fr 3fr;
      grid-template-rows: auto auto;
      gap: 5px 15px;
    }

    .news-author {
      font-weight: 600;
      color: #000000;
      font-size: 15px;
      grid-column: 1;
      grid-row: 1;
    }

    .news-date {
      color: #999999;
      font-size: 13px;
      grid-column: 1;
      grid-row: 2;
    }

    .news-post {
      font-size: 15px;
      color: #000000;
      grid-column: 2;
      grid-row: 1 / 3;
      align-self: center;
      line-height: 1.5;
    }

    .news-post a {
      transition: opacity 0.2s;
    }

    .news-post a:hover {
      opacity: 0.7;
    }



    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #666666;
    }

    .stat-value {
      font-weight: 600;
      color: #000000;
    }

    .refresh-btn {
      padding: 10px 20px;
      background: #000000;
      color: #ffffff;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      font-family: inherit;
    }

    .refresh-btn:hover {
      opacity: 0.8;
    }

    .refresh-btn:active {
      opacity: 0.6;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI News Feed</h1>
      <div class="subtitle">Latest AI updates from artificialintelligence-news.com</div>
    </header>

    <div class="controls">
      <div class="stats">
        <div>
          <span class="stat-value" id="total-news">0</span> posts
        </div>
        <div>
          Updated: <span class="stat-value" id="last-update">—</span>
        </div>
      </div>
      <button class="refresh-btn" onclick="loadNews()">Refresh</button>
    </div>

    <div id="loading" class="loading">
      Loading news feed...
    </div>

    <ul class="news-list" id="news-container"></ul>
  </div>

  <script>
    let allNews = [];
    const CACHE_KEY = 'ai_news_cache';
    const CACHE_DURATION = 10 * 60 * 1000; // 10 minutes
    const RSS_FEED_URL = 'https://www.artificialintelligence-news.com/feed/';
    const RSS2JSON_API = 'https://api.rss2json.com/v1/api.json';

    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffMs = now - date;
      const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      if (diffHours < 1) return 'Just now';
      if (diffHours < 24) return `${diffHours}h ago`;
      if (diffDays < 7) return `${diffDays}d ago`;
      
      return date.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
      });
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }

    function extractCategory(categories) {
      if (!categories || categories.length === 0) return 'AI News';
      return categories[0];
    }

    function renderNews(newsToRender) {
      const container = document.getElementById('news-container');
      
      if (newsToRender.length === 0) {
        container.innerHTML = '<div class="loading">No news found. Try refreshing later.</div>';
        return;
      }

      container.innerHTML = newsToRender.map(item => `
        <li class="news-item">
          <div class="news-text">
            <span class="news-author">
              ${extractCategory(item.categories)}
            </span>
            <span class="news-post">
              <a href="${item.link}" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">
                ${item.title}
              </a>
            </span>
            <span class="news-date">${formatDate(item.pubDate)}</span>
          </div>
        </li>
      `).join('');
    }


    // RSS Feed via RSS2JSON API
    function getCachedNews() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (!cached) return null;

        const { data, timestamp } = JSON.parse(cached);
        const now = Date.now();

        // Check if cache is still valid
        if (now - timestamp < CACHE_DURATION) {
          return data;
        }
        
        // Cache expired
        localStorage.removeItem(CACHE_KEY);
        return null;
      } catch (e) {
        console.error('Error reading cache:', e);
        return null;
      }
    }

    function setCachedNews(data) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          data,
          timestamp: Date.now()
        }));
      } catch (e) {
        console.error('Error saving cache:', e);
      }
    }

    async function fetchAINews() {
      // Try cache first
      const cached = getCachedNews();
      if (cached) {
        console.log('Using cached data');
        return cached;
      }

      console.log('Fetching fresh data from AI News...');
      
      try {
        // Use RSS2JSON API to convert RSS feed to JSON (free tier, no API key needed)
        const apiUrl = `${RSS2JSON_API}?rss_url=${encodeURIComponent(RSS_FEED_URL)}&count=40`;
        
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          throw new Error(`RSS2JSON API error: ${response.status}`);
        }
        
        const json = await response.json();
        
        if (json.status !== 'ok') {
          throw new Error(`RSS feed error: ${json.message}`);
        }
        
        // Extract items from feed
        const items = json.items || [];
        
        // Cache the results
        setCachedNews(items);
        
        return items;
      } catch (error) {
        console.error('Error fetching AI news:', error);
        throw error;
      }
    }

    async function loadNews() {
      const loading = document.getElementById('loading');
      const container = document.getElementById('news-container');
      loading.style.display = 'block';
      container.innerHTML = '';

      try {
        // Fetch AI news from RSS feed
        allNews = await fetchAINews();

        // Update stats
        document.getElementById('total-news').textContent = allNews.length;
        document.getElementById('last-update').textContent = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit'
        });

        renderNews(allNews);
        loading.style.display = 'none';

      } catch (error) {
        console.error('Error loading news:', error);
        loading.innerHTML = 'Error loading AI news. Please try again later.';
        loading.style.display = 'block';
      }
    }

    // Load news on page load
    loadNews();

    // Auto-refresh every 10 minutes (respecting cache)
    setInterval(loadNews, 10 * 60 * 1000);

    console.log('%c🤖 AI News Feed', 'font-size: 20px; font-weight: bold;');
    console.log('Fetching news from artificialintelligence-news.com');
    console.log('News is cached for 10 minutes to reduce API calls');
  </script>
</body>
</html>
