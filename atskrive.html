    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        height: 100%;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: none;
      }

      .container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .container::-webkit-scrollbar {
        display: none;
      }

      .card-slide {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1400px;
      }

      .card {
        position: relative;
        width: 90%;
        max-width: 500px;
        aspect-ratio: 9 / 16;
        transform-style: preserve-3d;
        transition: transform 600ms cubic-bezier(.2,.8,.2,1);
        cursor: pointer;
      }

      .card.is-flipped {
        transform: rotateY(180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border-radius: 24px;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }

      .face.back {
        transform: rotateY(180deg);
        background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 20px;
      }

      .phrase-da {
        font-size: clamp(28px, 7vw, 40px);
        font-weight: 400;
        line-height: 1.3;
        opacity: 0.98;
        letter-spacing: -0.02em;
      }

      .phrase-ru {
        font-size: clamp(24px, 6vw, 34px);
        font-weight: 700;
        line-height: 1.3;
        opacity: 0.98;
        letter-spacing: -0.02em;
        color: #7dd3fc;
      }

      .category {
        background: rgba(255,255,255,0.15);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        backdrop-filter: blur(10px);
        letter-spacing: 0.02em;
        margin-bottom: 20px;
      }

      .audio-controls {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        z-index: 10;
      }

      .btn-audio {
        width: 52px;
        height: 52px;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.25);
        color: white;
        border-radius: 50%;
        font-size: 24px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }

      .btn-audio:active {
        transform: scale(0.9);
      }

      .btn-audio:hover {
        background: rgba(255,255,255,0.25);
      }

      /* Timer */
      .timer-container {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .timer-display {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.2);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 12px 20px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #ffffff;
        min-width: 120px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .timer-display.running {
        background: rgba(34, 197, 94, 0.2);
        border-color: rgba(34, 197, 94, 0.4);
        color: #86efac;
      }

      .timer-display.finished {
        background: rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.4);
        color: #fca5a5;
        animation: pulse-timer 1s ease-in-out infinite;
      }

      @keyframes pulse-timer {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }

      .timer-controls {
        display: flex;
        gap: 8px;
      }

      .timer-btn {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.2s;
        user-select: none;
        flex: 1;
      }

      .timer-btn:active {
        transform: scale(0.95);
      }

      .timer-btn.start {
        background: rgba(34, 197, 94, 0.2);
        border-color: rgba(34, 197, 94, 0.4);
      }

      .timer-btn.reset {
        background: rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.4);
      }

      /* Progress bar */
      .progress-bar {
        position: fixed;
        bottom: env(safe-area-inset-bottom, 20px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
        left: 20px;
        right: 20px;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
        z-index: 100;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #22c55e, #38bdf8);
        width: 0%;
        transition: width 0.3s ease;
      }

      @media (max-width: 640px) {
        .card {
          padding: 24px 20px;
        }
      }
    </style>
  </head>

        const a = array.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }

          'Последствия': 'linear-gradient(135deg, #6b21a8 0%, #7c3aed 100%)',
          'Акцент': 'linear-gradient(135deg, #d97706 0%, #f59e0b 100%)',
          'Выводы': 'linear-gradient(135deg, #1e40af 0%, #2563eb 100%)',
          'Прогноз': 'linear-gradient(135deg, #7e22ce 0%, #9333ea 100%)',
          'Факторы': 'linear-gradient(135deg, #0369a1 0%, #0284c7 100%)',
          'Дискуссия': 'linear-gradient(135deg, #4c1d95 0%, #5b21b6 100%)',
          'Предположение': 'linear-gradient(135deg, #6d28d9 0%, #7c3aed 100%)',
          'Структура': 'linear-gradient(135deg, #1f2937 0%, #374151 100%)',
          'Дополнение': 'linear-gradient(135deg, #134e4a 0%, #115e59 100%)',
          'Контраст': 'linear-gradient(135deg, #be123c 0%, #e11d48 100%)',
          'Индикатор': 'linear-gradient(135deg, #ca8a04 0%, #eab308 100%)',
          'Проблемы': 'linear-gradient(135deg, #b91c1c 0%, #dc2626 100%)',
          'Преимущества': 'linear-gradient(135deg, #15803d 0%, #16a34a 100%)',
          'Влияние': 'linear-gradient(135deg, #6b21a8 0%, #7c3aed 100%)',
          'Связь': 'linear-gradient(135deg, #0e7490 0%, #0891b2 100%)',
          'Рост': 'linear-gradient(135deg, #047857 0%, #059669 100%)',
          'Спад': 'linear-gradient(135deg, #be123c 0%, #e11d48 100%)',
          'Пропорции': 'linear-gradient(135deg, #0c4a6e 0%, #075985 100%)',
          'Доли': 'linear-gradient(135deg, #475569 0%, #64748b 100%)',
          'Позитив': 'linear-gradient(135deg, #15803d 0%, #16a34a 100%)',
          'Негатив': 'linear-gradient(135deg, #b91c1c 0%, #dc2626 100%)',
          'Уточнение': 'linear-gradient(135deg, #0369a1 0%, #0284c7 100%)',
          'Перефраз': 'linear-gradient(135deg, #6d28d9 0%, #7c3aed 100%)',
          'Источник': 'linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%)'
        };
        return colorMap[category] || 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)';
      }

      function createCard(item, index, total) {
        const bgColor = getCardColor(item.cat);
        
        return `
          <div class="card-slide" data-index="${index}">
            <div class="card" data-index="${index}">
              <div class="face front" style="background: ${bgColor}">
                <div class="category">${item.cat}</div>
                <div class="main-content">
                  <div class="phrase-da">${item.da}</div>
                </div>
                <div class="audio-controls">
                  <button class="btn-audio speak-da-btn" data-index="${index}">🇩🇰</button>
                  <button class="btn-audio speak-ru-btn" data-index="${index}">🇷🇺</button>
                </div>
              </div>
              <div class="face back" style="background: ${bgColor}; filter: brightness(0.85);">
                <div class="category">${item.cat}</div>
                <div class="main-content">
                  <div class="phrase-ru">${item.ru}</div>
                </div>
                <div class="audio-controls">
                  <button class="btn-audio speak-da-btn" data-index="${index}">🇩🇰</button>
                  <button class="btn-audio speak-ru-btn" data-index="${index}">🇷🇺</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderCards() {
        const total = state.order.length;
        const html = state.order.map((dataIndex, i) => 
          createCard(DATA[dataIndex], i, total)
        ).join('');
        container.innerHTML = html;

        // Add event listeners
        document.querySelectorAll('.card').forEach((card, index) => {
          card.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
              flipCard(card);
            }
          });
        });

        document.querySelectorAll('.speak-da-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(e.target.dataset.index);
            const dataIndex = state.order[index];
            const item = DATA[dataIndex];
            speak(item.da, 'da');
          });
        });

        document.querySelectorAll('.speak-ru-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(e.target.dataset.index);
            const dataIndex = state.order[index];
            const item = DATA[dataIndex];
            speak(item.ru, 'ru');
          });
        });

        updateStats();
      }

      function flipCard(card) {
        card.classList.toggle('is-flipped');
      }

      function updateStats() {
        const total = DATA.length;
        const current = Math.floor(container.scrollTop / window.innerHeight) + 1;
        
        const progress = (current / total) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
      }

      function reset(doShuffle = true) {
        state.order = doShuffle ? shuffle([...DATA.keys()]) : [...DATA.keys()];
        state.currentIndex = 0;
        renderCards();
        container.scrollTop = 0;
      }

      // Speech synthesis
      let voicesLoaded = false;
      let availableVoices = [];
        
      function loadVoices() {
        availableVoices = window.speechSynthesis.getVoices();
        if (availableVoices.length > 0) {
          voicesLoaded = true;
          console.log('Loaded voices:', availableVoices.map(v => `${v.name} (${v.lang})`));
        }
      }
        
      if (window.speechSynthesis) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
        
        document.addEventListener('click', () => {
          setTimeout(loadVoices, 100);
        }, { once: true });
      }

      function selectBestVoice(lang) {
        if (!voicesLoaded || availableVoices.length === 0) {
          console.warn('No voices loaded yet');
          return null;
        }

        const langCode = lang === 'da' ? 'da' : 'ru';
        
        const danishVoices = [
          'sara', 'ida', 'christel', 'magnus', 'freja',
          'google dansk', 'google danish',
          'microsoft christel', 'dansk', 'danish', 'da-dk'
        ];
        const russianVoices = [
          'yuri', 'milena', 'katya', 'ekaterina',
          'google русский', 'google russian',
          'microsoft ekaterina', 'russian', 'русский', 'ru-ru'
        ];
        
        const preferredNames = lang === 'da' ? danishVoices : russianVoices;
        
        const exactMatches = availableVoices.filter(v => 
          v.lang.toLowerCase().startsWith(langCode)
        );
        
        const localVoices = exactMatches.filter(v => v.localService);
        const remoteVoices = exactMatches.filter(v => !v.localService);
        
        for (const prefName of preferredNames) {
          let voice = localVoices.find(v => 
            v.name.toLowerCase().includes(prefName)
          );
          if (voice) return voice;
          
          voice = remoteVoices.find(v => 
            v.name.toLowerCase().includes(prefName)
          );
          if (voice) return voice;
        }
        
        if (localVoices.length > 0) return localVoices[0];
        if (exactMatches.length > 0) return exactMatches[0];
        
        return null;
      }

      function cleanTextForSpeech(text, lang) {
        if (!text) return text;
        
        let cleaned = text.trim();
        cleaned = cleaned.replace(/<[^>]*>/g, '');
        cleaned = cleaned.replace(/\s+/g, ' ');
        
        if (lang === 'da' || lang === 'ru') {
          cleaned = cleaned.replace(/([,;:])/g, '$1 ');
          cleaned = cleaned.replace(/\s+/g, ' ');
        }
        
        if (!/[.!?…]$/.test(cleaned)) {
          cleaned += '.';
        }
        
        return cleaned;
      }

      function speak(text, lang) {
        if (!window.speechSynthesis || !text) {
          console.error('Speech synthesis not available');
          return;
        }
        
        const synth = window.speechSynthesis;
        
        if (synth.speaking) {
          synth.cancel();
        }
        
        setTimeout(() => {
          const cleanedText = cleanTextForSpeech(text, lang);
          
          const utterance = new SpeechSynthesisUtterance(cleanedText);
          utterance.lang = lang === 'da' ? 'da-DK' : 'ru-RU';
          
          const voice = selectBestVoice(lang);
          if (voice) {
            utterance.voice = voice;
            console.log(`Speaking with voice: ${voice.name} (${voice.lang})`);
          } else { 
            console.warn(`No voice found for ${lang}, using default`);
          }
          
          if (lang === 'da') {
            utterance.rate = 0.82;
            utterance.pitch = 1.05;
            utterance.volume = 1.0;
          } else if (lang === 'ru') {
            utterance.rate = 0.88;
            utterance.pitch = 0.98;
            utterance.volume = 1.0;
          }
          
          utterance.onerror = (event) => {
            console.error('Speech error:', event.error, event);
            if (event.error !== 'canceled') {
              showToast('🔇 Ошибка воспроизведения');
            }
          };
          
          if (synth.paused) {
            synth.resume();
          }
          
          try {
            synth.speak(utterance);
            
            setTimeout(() => {
              if (synth.paused) {
                synth.resume();
              }
            }, 100);
          } catch (error) {
            console.error('Failed to speak:', error);
            showToast('🔇 Не удалось воспроизвести');
          }
        }, 150);
      }

      function init() {
        container = document.getElementById('container');
        
        reset(true);

        container.addEventListener('scroll', () => {
          updateStats();
        });

        document.addEventListener('click', () => {
          if (!audioContextReady) {
            try {
              if (window.speechSynthesis) {
                window.speechSynthesis.resume();
              }
              audioContextReady = true;
            } catch {}
          }
        }, { once: true });
      }

      function showToast(message) {
        const toast = document.createElement('div');
        toast.textContent = message;
        toast.style.cssText = `
          position: fixed;
          bottom: 100px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(0,0,0,0.8);
          color: white;
          padding: 12px 24px;
          border-radius: 24px;
          z-index: 1000;
          backdrop-filter: blur(10px);
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      }

      // Timer functionality
      let timerInterval = null;
      let timeRemaining = 5 * 60;
      let isTimerRunning = false;
      const TIMER_DURATION = 5 * 60;

      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }

      function updateTimerDisplay() {
        const display = document.getElementById('timerDisplay');
        display.textContent = formatTime(timeRemaining);
        
        if (timeRemaining === 0) {
          display.classList.add('finished');
          display.classList.remove('running');
        } else if (isTimerRunning) {
          display.classList.add('running');
          display.classList.remove('finished');
        } else {
          display.classList.remove('running', 'finished');
        }
      }

      function playAlarmSound() {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99];
        
        notes.forEach((freq, index) => {
          setTimeout(() => {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = freq;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.8);
          }, index * 300);
        });
        
        showToast('⏰ Время истекло!');
      }

      function startTimer() {
        if (isTimerRunning) {
          clearInterval(timerInterval);
          isTimerRunning = false;
          document.getElementById('timerStart').textContent = '▶';
          updateTimerDisplay();
          return;
        }

        if (timeRemaining === 0) {
          timeRemaining = TIMER_DURATION;
        }

        isTimerRunning = true;
        document.getElementById('timerStart').textContent = '⏸';
        
        timerInterval = setInterval(() => {
          timeRemaining--;
          updateTimerDisplay();
          
          if (timeRemaining === 0) {
            clearInterval(timerInterval);
            isTimerRunning = false;
            document.getElementById('timerStart').textContent = '▶';
            playAlarmSound();
          }
        }, 1000);
      }

      function resetTimer() {
        clearInterval(timerInterval);
        isTimerRunning = false;
        timeRemaining = TIMER_DURATION;
        document.getElementById('timerStart').textContent = '▶';
        updateTimerDisplay();
      }

      function initTimer() {
        document.getElementById('timerStart').addEventListener('click', startTimer);
        document.getElementById('timerReset').addEventListener('click', resetTimer);
        updateTimerDisplay();
      }

      document.addEventListener('DOMContentLoaded', () => {
        init();
        initTimer();
      });
    </script>
  </body>
</html>
