<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dansk • Флешкарты</title>
    <meta name="theme-color" content="#000000" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        height: 100%;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: none;
      }

      .container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .container::-webkit-scrollbar {
        display: none;
      }

      .card-slide {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1400px;
      }

      .card {
        position: relative;
        width: 90%;
        max-width: 500px;
        aspect-ratio: 9 / 16;
        transform-style: preserve-3d;
        transition: transform 600ms cubic-bezier(.2,.8,.2,1);
        cursor: pointer;
      }

      .card.is-flipped {
        transform: rotateY(180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border-radius: 24px;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }

      .face.back {
        transform: rotateY(180deg);
        background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .emoji {
        font-size: 48px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      }

      .counter {
        background: rgba(255,255,255,0.15);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        backdrop-filter: blur(10px);
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 20px;
      }

      .word-display {
        font-size: clamp(24px, 6vw, 36px);
        font-weight: 700;
        line-height: 1.4;
        margin-bottom: 12px;
      }

      .context {
        font-size: clamp(18px, 4.5vw, 24px);
        line-height: 1.5;
        opacity: 0.95;
      }

      .mark {
        background: rgba(56, 189, 248, 0.3);
        color: #38bdf8;
        padding: 2px 6px;
        border-radius: 6px;
        font-weight: 600;
      }

      .translation {
        font-size: clamp(20px, 5vw, 28px);
        font-weight: 600;
        line-height: 1.4;
        margin-bottom: 16px;
      }

      .note {
        font-size: 16px;
        opacity: 0.7;
        line-height: 1.6;
        margin-top: 12px;
      }

      .hint {
        font-size: 14px;
        opacity: 0.6;
        text-align: center;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.3; }
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        padding: 12px 20px;
        border-radius: 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
        user-select: none;
      }

      .btn:active {
        transform: scale(0.95);
      }

      .btn-success {
        background: rgba(34, 197, 94, 0.2);
        border-color: rgba(34, 197, 94, 0.4);
      }

      .btn-error {
        background: rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.4);
      }

      .btn-primary {
        background: rgba(56, 189, 248, 0.2);
        border-color: rgba(56, 189, 248, 0.4);
      }

      /* Sidebar UI */
      .sidebar {
        position: fixed;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 100;
      }

      .sidebar-btn {
        width: 56px;
        height: 56px;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(10px);
        font-size: 24px;
        transition: all 0.2s;
      }

      .sidebar-btn:active {
        transform: scale(0.9);
      }

      .sidebar-label {
        font-size: 11px;
        text-align: center;
        margin-top: 4px;
        opacity: 0.8;
      }

      /* Top bar stats */
      .top-stats {
        position: fixed;
        top: env(safe-area-inset-top, 20px);
        top: calc(env(safe-area-inset-top, 0px) + 20px);
        left: 20px;
        right: 80px;
        z-index: 100;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .stat-pill {
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid rgba(255,255,255,0.1);
      }

      /* Progress bar */
      .progress-bar {
        position: fixed;
        bottom: env(safe-area-inset-bottom, 20px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
        left: 20px;
        right: 20px;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
        z-index: 100;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #22c55e, #38bdf8);
        width: 0%;
        transition: width 0.3s ease;
      }

      @media (max-width: 640px) {
        .sidebar {
          right: 12px;
        }
        .sidebar-btn {
          width: 48px;
          height: 48px;
          font-size: 20px;
        }
        .top-stats {
          right: 70px;
        }
      }
    </style>
  </head>

      const appStateKey = "dansk-trainer-tiktok-v1";
      const state = {
        order: [],
        known: new Set(),
        currentIndex: 0
      };

      let container;
      let audioContextReady = false;

      function shuffle(array) {
        const a = array.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function highlightContext(text, target) {
        if (!text || !target) return text;
        const esc = target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const re = new RegExp(`(\\b${esc}\\b)`, "i");
        return text.replace(re, '<span class="mark">$1</span>');
      }

      function createCard(item, index, total) {
        const ctxHtml = highlightContext(item.ctxDa || item.da, item.da);
        
        return `
          <div class="card-slide" data-index="${index}">
            <div class="card" data-index="${index}">
              <div class="face front">
                <div class="top-bar">
                  <div class="emoji">${item.emoji || "✨"}</div>
                  <div class="counter">${index + 1} / ${total}</div>
                </div>
                <div class="main-content">
                  <div class="word-display">${item.da}</div>
                  <div class="context">${ctxHtml}</div>
                </div>
                <div class="actions">
                  <button class="btn btn-primary flip-btn">🪄 Показать перевод</button>
                </div>
              </div>
              <div class="face back">
                <div class="top-bar">
                  <div class="emoji">🧠</div>
                  <div class="counter">${index + 1} / ${total}</div>
                </div>
                <div class="main-content">
                  <div class="translation">${item.ru}</div>
                  <div class="context">${item.ctxRu || ""}</div>
                  <div class="note">${item.note || ""}</div>
                </div>
                <div class="actions">
                  <button class="btn btn-success know-btn">👍 Знаю</button>
                  <button class="btn btn-error dontknow-btn">🤔 Не знаю</button>
                  <button class="btn btn-primary flip-btn">🔙 Назад</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderCards() {
        const total = state.order.length;
        const html = state.order.map((dataIndex, i) => 
          createCard(DATA[dataIndex], i, total)
        ).join('');
        container.innerHTML = html;

        // Add event listeners
        document.querySelectorAll('.card').forEach((card, index) => {
          card.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
              flipCard(card);
            }
          });
        });

        document.querySelectorAll('.flip-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const card = e.target.closest('.card');
            flipCard(card);
          });
        });

        document.querySelectorAll('.know-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(e.target.closest('.card-slide').dataset.index);
            markCard(index, true);
          });
        });

        document.querySelectorAll('.dontknow-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(e.target.closest('.card-slide').dataset.index);
            markCard(index, false);
          });
        });

        updateStats();
      }

      function flipCard(card) {
        card.classList.toggle('is-flipped');
      }

      function markCard(index, isKnown) {
        const dataIndex = state.order[index];
        if (isKnown) {
          state.known.add(dataIndex);
        }
        persist();
        updateStats();
        
        // Scroll to next card
        const nextSlide = container.children[index + 1];
        if (nextSlide) {
          nextSlide.scrollIntoView({ behavior: 'smooth' });
        }
      }

      function updateStats() {
        const total = DATA.length;
        const known = state.known.size;
        const current = Math.floor(container.scrollTop / window.innerHeight) + 1;
        
        document.getElementById('totalCount').textContent = `${total} карточек`;
        document.getElementById('progressText').textContent = `${current}/${state.order.length}`;
        document.getElementById('knownText').textContent = `✓ ${known}`;
        
        const progress = (known / total) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
      }

      function reset(doShuffle = true) {
        state.order = doShuffle ? shuffle([...DATA.keys()]) : [...DATA.keys()];
        state.known.clear();
        state.currentIndex = 0;
        persist();
        renderCards();
        container.scrollTop = 0;
      }

      function persist() {
        try {
          localStorage.setItem(appStateKey, JSON.stringify({
            order: state.order,
            known: Array.from(state.known),
            currentIndex: state.currentIndex
          }));
        } catch {}
      }

      function restore() {
        try {
          const raw = localStorage.getItem(appStateKey);
          if (!raw) return false;
          const obj = JSON.parse(raw);
          if (!Array.isArray(obj.order)) return false;
          state.order = obj.order.filter(x => x >= 0 && x < DATA.length);
          if (state.order.length !== DATA.length) return false;
          state.known = new Set(obj.known || []);
          state.currentIndex = obj.currentIndex || 0;
          return true;
        } catch {
          return false;
        }
      }

      // Speech synthesis
      function speak(text, lang) {
        if (!window.speechSynthesis || !text) return;
        
        const synth = window.speechSynthesis;
        synth.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang === 'da' ? 'da-DK' : 'ru-RU';
        utterance.rate = lang === 'da' ? 0.86 : 0.95;
        utterance.pitch = 1.0;
        
        synth.speak(utterance);
      }

      function getCurrentCard() {
        const index = Math.floor(container.scrollTop / window.innerHeight);
        const dataIndex = state.order[index];
        return DATA[dataIndex];
      }

      function init() {
        container = document.getElementById('container');
        
        const restored = restore();
        if (!restored) reset(true);
        else renderCards();

        // Update stats on scroll
        container.addEventListener('scroll', () => {
          updateStats();
        });

        // Sidebar controls
        document.getElementById('btnShuffle').addEventListener('click', () => {
          reset(true);
          showToast('🔀 Перемешано');
        });

        document.getElementById('btnSpeakDa').addEventListener('click', () => {
          const card = getCurrentCard();
          if (card) speak(card.ctxDa || card.da, 'da');
        });

        document.getElementById('btnSpeakRu').addEventListener('click', () => {
          const card = getCurrentCard();
          if (card) speak(card.ctxRu || card.ru, 'ru');
        });

        document.getElementById('btnReset').addEventListener('click', () => {
          if (confirm('Сбросить весь прогресс?')) {
            localStorage.removeItem(appStateKey);
            reset(true);
            showToast('🔁 Прогресс сброшен');
          }
        });

        // Initialize audio context on first interaction
        document.addEventListener('click', () => {
          if (!audioContextReady) {
            try {
              if (window.speechSynthesis) {
                window.speechSynthesis.resume();
              }
              audioContextReady = true;
            } catch {}
          }
        }, { once: true });
      }

      function showToast(message) {
        const toast = document.createElement('div');
        toast.textContent = message;
        toast.style.cssText = `
          position: fixed;
          bottom: 100px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(0,0,0,0.8);
          color: white;
          padding: 12px 24px;
          border-radius: 24px;
          z-index: 1000;
          backdrop-filter: blur(10px);
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      }

      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
