<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dansk • Флешкарты союзов и связок</title>
    <meta name="theme-color" content="#000000" />
    <style>
      :root {
        --bg: #000000;
        --surface: #111111; /* dark surface */
        --card: #1a1a1a;
        --muted: #888888; /* light gray for muted text */
        --text: #ffffff; /* white text */
        --accent: #3b82f6; /* blue accent */
        --good: #22c55e; /* green-500 */
        --warn: #f59e0b; /* amber-500 */
        --bad: #ef4444;  /* red-500 */
        --ring: 59 130 246;
      }
      html, body {
        height: 100%;
        margin: 0;
        background: radial-gradient(1200px 700px at 0% 0%, #1a1a2e, transparent),
                    radial-gradient(900px 500px at 100% 0%, #16213e, transparent),
                    radial-gradient(900px 500px at 50% 100%, #0f0f23, transparent),
                    var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .app {
        max-width: 920px;
        margin: 0 auto;
        padding: 16px 16px 64px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 16px;
        min-height: 100dvh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .title em {
        font-style: normal;
        color: var(--accent);
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .pill {
        background: rgba(59, 130, 246, 0.15);
        color: var(--accent);
        border: 1px solid rgba(59, 130, 246, 0.40);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
      }
      .stats {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .stats .pill {
        border-color: rgba(255, 255, 255, 0.20);
        color: var(--muted);
        background: rgba(255, 255, 255, 0.08);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .card-wrap {
        perspective: 1400px;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(720px, 100%);
        aspect-ratio: 16 / 10;
        background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.0)), var(--card);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        position: relative;
        transform-style: preserve-3d;
        transition: transform 600ms cubic-bezier(.2,.8,.2,1), box-shadow 200ms;
        cursor: pointer;
        outline: none;
      }
      .card:hover { box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
      .card.is-flipped { transform: rotateY(180deg); }
      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 20px;
      }
      .face .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      .face .main {
        display: grid;
        place-items: center;
        text-align: center;
        padding: 4px;
      }
      .da { font-size: clamp(18px, 4.5vw, 28px); font-weight: 600; }
      .context {
        font-size: clamp(18px, 4.5vw, 26px);
        line-height: 1.35;
        max-width: 88%;
      }
      .mark {
        background: rgba(59,130,246,0.30);
        color: #93c5fd;
        padding: 0 4px;
        border-radius: 6px;
      }
      .emoji {
        font-size: clamp(24px, 5.5vw, 40px);
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
      }
      .hint {
        font-size: 14px;
        color: var(--muted);
      }
      .back { transform: rotateY(180deg); }
      .ru {
        font-size: clamp(18px, 4.5vw, 26px);
        font-weight: 600;
      }
      .note {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .controls button {
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.0));
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.20);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
        user-select: none;
      }
      .controls button:hover { transform: translateY(-1px); }
      .controls button:active { transform: translateY(0); }
      .controls .ok { border-color: rgba(34,197,94,.6); }
      .controls .nok { border-color: rgba(239,68,68,.6); }
      .controls .flip { border-color: rgba(245,158,11,.6); }
      .controls .shuffle { border-color: rgba(59,130,246,.6); }

      .progress {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }
      .bar {
        height: 10px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.20);
      }
      .bar > span {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #22c55e, #38bdf8);
      }

      .small {
        font-size: 12px;
        color: var(--muted);
      }
      .muted-link {
        color: var(--muted);
        text-decoration: underline dotted rgba(255, 255, 255, 0.35);
        cursor: pointer;
      }

      @media (max-width: 640px) {
        .controls { grid-template-columns: repeat(2, 1fr); }
        header { flex-direction: column; align-items: flex-start; }
        .stats { width: 100%; }
      }

      
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <header>
        <div class="title" role="heading" aria-level="1">
          <span class="emoji" aria-hidden="true">🇩🇰</span>
          <span>Dansk • Связки и вводные слова <em>тренажёр</em></span>
        </div>
        <div class="toolbar">
          <span class="pill" id="totalCount">0 карточек</span>
          <div class="stats">
            <span class="pill" id="progressText">0 / 0</span>
            <span class="pill" id="knownText">Знаю: 0</span>
            <span class="pill" id="unknownText">Не знаю: 0</span>
          </div>
        </div>
      </header>

      <main class="grid">
        <div class="card-wrap">
          <article class="card" id="card" tabindex="0" aria-live="polite" aria-label="Флешкарта" title="Нажмите для переворота">
            <section class="face front">
              <div class="top-row">
                <span class="hint" id="hint">Нажмите для переворота</span>
                <span class="emoji" id="emojiFront">✨</span>
              </div>
              <div class="main">
                <div class="context" id="context">—</div>
              </div>
              <div class="small" id="idx">0 / 0</div>
            </section>
            <section class="face back">
              <div class="top-row">
                <span class="hint">Обратная сторона</span>
                <span class="emoji" id="emojiBack">🧠</span>
              </div>
              <div class="main">
                <div class="ru" id="ru">—</div>
                <div class="note" id="note">—</div>
                <div class="note" id="ctxRu">—</div>
              </div>
              <div class="small">Отметьте: знаю / не знаю</div>
            </section>
          </article>
        </div>

        <div class="controls" aria-label="Управление">
          <button class="flip" id="btnFlip" title="Показать перевод">🪄 Показать</button>
          <button class="ok" id="btnKnow" title="Знаю">👍 Знаю</button>
          <button class="nok" id="btnDontKnow" title="Не знаю">🤔 Не знаю</button>
          <button class="shuffle" id="btnShuffle" title="Перемешать">🔀 Перемешать</button>
        </div>

        <div class="progress">
          <div class="bar" aria-label="Прогресс">
            <span id="bar"></span>
          </div>
          <div class="small">
            <span class="muted-link" id="btnReset" title="Сбросить прогресс">🔁 сброс</span>
          </div>
        </div>

        <div class="controls" aria-label="Аудио">
          <button class="flip" id="btnSpeakDa" title="Прослушать датский">🔊 Послушать (DA)</button>
          <button class="flip" id="btnSpeakRu" title="Прослушать перевод">🎧 Послушать (RU)</button>
          <button class="shuffle" id="btnSpeakStop" title="Остановить звук">⏹ Остановить</button>
          <div></div>
        </div>

        <!-- Hidden audio elements for high-quality pre-recorded files (если добавите в папку audio/) -->
        <audio id="audioDa" preload="none"></audio>
        <audio id="audioRu" preload="none"></audio>
      </main>

      <footer class="small">
        Подсказка: нажимайте пробел для переворота, ←/→ для навигации, 1/2 — знаю/не знаю.
      </footer>
    </div>

    <script>
      const DATA = [
        {
          da: "herudover",
          ru: "кроме того, к тому же",
          note: "Bruges til at tilføje information.",
          emoji: "➕",
          ctxDa: "Vi har kaffe og te, og herudover tilbyder vi snacks.",
          ctxRu: "У нас есть кофе и чай, и кроме того мы предлагаем снеки."
        },
        {
          da: "derudover",
          ru: "кроме того, сверх того",
          note: "Lignende funktion som herudover.",
          emoji: "🧩",
          ctxDa: "Hun arbejder fuld tid, og derudover studerer hun om aftenen.",
          ctxRu: "Она работает полный день, и кроме того учится по вечерам."
        },
        {
          da: "desuden",
          ru: "к тому же, более того",
          note: "Kan bruges til at tilføje ekstra pointe.",
          emoji: "✨",
          ctxDa: "Desuden er det billigere om vinteren.",
          ctxRu: "К тому же зимой это дешевле."
        },
        {
          da: "ovenikøbet",
          ru: "вдобавок, сверх того",
          note: "Ofte lidt mere uformel end desuden.",
          emoji: "🎁",
          ctxDa: "De kom for sent, og ovenikøbet havde de glemt billetterne.",
          ctxRu: "Они опоздали, и вдобавок забыли билеты."
        },
        {
          da: "tilmed",
          ru: "вдобавок, также",
          note: "Ligner desuden, bruges til ekstra info.",
          emoji: "➕",
          ctxDa: "Han taler dansk og engelsk, tilmed tysk.",
          ctxRu: "Он говорит по-датски и по-английски, вдобавок по-немецки."
        },
        {
          da: "samt",
          ru: "и, вместе с",
          note: "Binder to elementer sammen.",
          emoji: "🔗",
          ctxDa: "Bogen indeholder teori samt øvelser.",
          ctxRu: "Книга содержит теорию и упражнения."
        },
        {
          da: "endvidere",
          ru: "далее, кроме того",
          note: "Formelt, bruges i skriftlige tekster.",
          emoji: "📄",
          ctxDa: "Endvidere viser resultaterne en klar tendens.",
          ctxRu: "Далее, результаты показывают ясную тенденцию."
        },
        {
          da: "ydermere",
          ru: "более того, кроме того",
          note: "Formelt, akademisk stil.",
          emoji: "🎓",
          ctxDa: "Ydermere kan metoden anvendes i praksis.",
          ctxRu: "Более того, метод можно применять на практике."
        },
        {
          da: "i tillæg",
          ru: "в дополнение, вдобавок",
          note: "Bruges til at angive ekstra information.",
          emoji: "📎",
          ctxDa: "I tillæg til frokosten får du en dessert.",
          ctxRu: "В дополнение к обеду ты получаешь десерт."
        },
        {
          da: "udover det",
          ru: "кроме этого",
          note: "Kan introducere ny information.",
          emoji: "📌",
          ctxDa: "Udover det vil vi gerne sige tak for hjælpen.",
          ctxRu: "Кроме этого, мы хотим сказать спасибо за помощь."
        }
      ];

      const appStateKey = "dansk-trainer-state-v1";
      const $ = (id) => document.getElementById(id);

      const state = {
        order: [],
        index: 0,
        known: new Set(),
        unknown: new Set(),
        flipped: false
      };

      function shuffle(array) {
        const a = array.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function persist() {
        const serializable = {
          order: state.order,
          index: state.index,
          known: Array.from(state.known),
          unknown: Array.from(state.unknown),
          flipped: state.flipped
        };
        try { localStorage.setItem(appStateKey, JSON.stringify(serializable)); } catch {}
      }

      function restore() {
        try {
          const raw = localStorage.getItem(appStateKey);
          if (!raw) return false;
          const obj = JSON.parse(raw);
          if (!Array.isArray(obj.order) || typeof obj.index !== "number") return false;
          state.order = obj.order.filter((x) => Number.isInteger(x) && x >= 0 && x < DATA.length);
          if (state.order.length !== DATA.length) return false;
          state.index = Math.min(Math.max(0, obj.index), state.order.length - 1);
          state.known = new Set(Array.isArray(obj.known) ? obj.known : []);
          state.unknown = new Set(Array.isArray(obj.unknown) ? obj.unknown : []);
          state.flipped = !!obj.flipped;
          return true;
        } catch {
          return false;
        }
      }

      function reset(fullShuffle = true) {
        state.order = fullShuffle ? shuffle([...DATA.keys()]) : [...DATA.keys()];
        state.index = 0;
        state.known.clear();
        state.unknown.clear();
        state.flipped = false;
        render();
        persist();
      }

      function currentItem() {
        const idx = state.order[state.index];
        return { idx, item: DATA[idx] };
      }

      function setFlipped(value) {
        state.flipped = value;
        const card = $("card");
        card.classList.toggle("is-flipped", state.flipped);
        $("btnFlip").textContent = state.flipped ? "🔙 Скрыть" : "🪄 Показать";
        persist();
      }

      function nextCard() {
        if (state.index < state.order.length - 1) {
          state.index += 1;
          state.flipped = false;
          render();
          persist();
          return;
        }
        // Если есть неизвестные — повторим их блоком
        if (state.unknown.size > 0) {
          const again = Array.from(state.unknown);
          state.order = again;
          state.index = 0;
          state.unknown.clear();
          state.flipped = false;
          render();
          persist();
          return;
        }
        // Конец: всё выучено
        toast("🎉 Отлично! Вы прошли все карточки.");
      }

      function prevCard() {
        if (state.index > 0) {
          state.index -= 1;
          state.flipped = false;
          render();
          persist();
        }
      }

      function markKnown(isKnown) {
        const { idx } = currentItem();
        if (isKnown) {
          state.known.add(idx);
          state.unknown.delete(idx);
        } else {
          state.unknown.add(idx);
          state.known.delete(idx);
        }
        nextCard();
      }

      function highlightContext(text, target) {
        const esc = target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const re = new RegExp(`(\\b${esc}\\b)`, "i");
        return text.replace(re, '<span class="mark">$1</span>');
      }

      function render() {
        const total = DATA.length;
        const known = state.known.size;
        const { idx, item } = currentItem();
        const ctxHtml = highlightContext(item.ctxDa || item.da, item.da);
        $("context").innerHTML = ctxHtml;
        $("ru").textContent = item.ru;
        $("note").textContent = item.note;
        $("ctxRu").textContent = item.ctxRu || "";
        $("emojiFront").textContent = item.emoji || "✨";
        $("emojiBack").textContent = "🧠";
        $("idx").textContent = `${state.index + 1} / ${state.order.length}`;
        $("totalCount").textContent = `${total} карточек`;
        $("progressText").textContent = `${state.index + 1} / ${state.order.length}`;
        $("knownText").textContent = `Знаю: ${known}`;
        const unknownCount = state.order.length - known;
        $("unknownText").textContent = `Не знаю: ${unknownCount}`;
        const pct = Math.round(((state.index) / Math.max(1, state.order.length)) * 100);
        $("bar").style.width = pct + "%";
        $("card").classList.toggle("is-flipped", state.flipped);
        $("btnFlip").textContent = state.flipped ? "🔙 Скрыть" : "🪄 Показать";
        $("btnFlip").textContent = state.flipped ? "🔙 Скрыть" : "🪄 Показать";
      }

      function toast(text) {
        const el = document.createElement("div");
        el.textContent = text;
        el.style.position = "fixed";
        el.style.bottom = "16px";
        el.style.left = "50%";
        el.style.transform = "translateX(-50%)";
        el.style.background = "rgba(0,0,0,0.9)";
        el.style.border = "1px solid rgba(255,255,255,0.25)";
        el.style.color = "#ffffff";
        el.style.padding = "10px 12px";
        el.style.borderRadius = "10px";
        el.style.zIndex = "40";
        el.style.pointerEvents = "none";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
      }

      function init() {
        const ok = restore();
        if (!ok) reset(true); else render();

        $("card").addEventListener("click", () => setFlipped(!state.flipped));
        $("btnFlip").addEventListener("click", () => setFlipped(!state.flipped));
        $("btnKnow").addEventListener("click", () => markKnown(true));
        $("btnDontKnow").addEventListener("click", () => markKnown(false));
        $("btnShuffle").addEventListener("click", () => { reset(true); toast("🔀 Перемешано"); });
        $("btnReset").addEventListener("click", () => { localStorage.removeItem(appStateKey); reset(true); toast("🔁 Сброшено"); });

        // Audio (TTS)
        const synth = window.speechSynthesis;
        let voices = [];
        function loadVoices() {
          voices = synth.getVoices();
        }
        loadVoices();
        if (typeof speechSynthesis !== "undefined") {
          speechSynthesis.onvoiceschanged = loadVoices;
        }

        // Mobile unlock (iOS/Android) to enable audio/TTS after first user gesture
        let audioUnlocked = false;
        function unlockAudioOnce() {
          if (audioUnlocked) return;
          audioUnlocked = true;
          try { if (window.speechSynthesis) { window.speechSynthesis.resume(); } } catch {}
          try {
            const silent = new SpeechSynthesisUtterance(" ");
            silent.volume = 0;
            window.speechSynthesis.speak(silent);
            window.speechSynthesis.cancel();
          } catch {}
          try {
            const a = new Audio();
            a.muted = true;
            const playPromise = a.play();
            if (playPromise && typeof playPromise.then === "function") {
              playPromise.then(() => { try { a.pause(); } catch {} }).catch(() => {});
            }
          } catch {}
        }
        document.addEventListener("touchstart", unlockAudioOnce, { once: true, passive: true });
        document.addEventListener("click", unlockAudioOnce, { once: true });

        function selectVoice(lang) {
          const lower = (s) => (s || "").toLowerCase();
          const candidatesByName = lang === "da" ? [
            // Common high-quality Danish voices (browsers/OS vary)
            "microsoft christel", "christel", "google dansk", "google danish", "google dk", "sara", "da-dk"
          ] : lang === "ru" ? [
            "microsoft ekaterina", "ekaterina", "google русский", "google russian", "milena", "ru-ru"
          ] : [];
          // Exact lang match first
          const langCode = lang === "da" ? "da-dk" : lang === "ru" ? "ru-ru" : (lang || "").toLowerCase();
          const exactLang = voices.filter(v => lower(v.lang).startsWith(langCode));
          // Sort exact by preferred names
          for (const namePart of candidatesByName) {
            const v = exactLang.find(vv => lower(vv.name).includes(namePart));
            if (v) return v;
          }
          // Fallback: any exact lang
          if (exactLang[0]) return exactLang[0];
          // Fallback: any voice that mentions language in name
          for (const namePart of candidatesByName) {
            const v = voices.find(vv => lower(vv.name).includes(namePart));
            if (v) return v;
          }
          return voices[0];
        }

        function normalizeText(text, langPrefer, targetWord) {
          if (!text) return text;
          // Mobile/Safari-safe: collapse spaces only (no Unicode property regex)
          let t = String(text).replace(/\s+/g, " ").trim();
          if (langPrefer === "da" && targetWord) {
            // Insert a short pause after the connector if missing punctuation
            const esc = targetWord.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const re = new RegExp(`(\\b${esc}\\b)(?![\",\.!?;:])`, "i");
            t = t.replace(re, "$1,");
            t = t.replace(/\s*,\s*/g, ", ");
          }
          // Ensure sentence-final punctuation for smoother cadence
          if (!/[\.!?…]$/.test(t)) t += ".";
          return t;
        }

        function voicesReady() {
          return Array.isArray(voices) && voices.length > 0;
        }

        function speak(text, langPrefer, targetWord) {
          const cleaned = normalizeText(text, langPrefer, targetWord);
          if (!cleaned) return;
          if (!window.speechSynthesis) { toast("🔇 Нет поддержки TTS в браузере"); return; }
          synth.cancel();
          const start = () => {
            const utter = new SpeechSynthesisUtterance(cleaned);
            const v = selectVoice(langPrefer);
            if (v) utter.voice = v;
            utter.lang = v?.lang || (langPrefer === "da" ? "da-DK" : langPrefer === "ru" ? "ru-RU" : "en-US");
            // Tuned for smoother prosody
            if (langPrefer === "da") { utter.rate = 0.86; utter.pitch = 1.02; }
            else if (langPrefer === "ru") { utter.rate = 0.95; utter.pitch = 1.0; }
            else { utter.rate = 1.0; utter.pitch = 1.0; }
            utter.volume = 1.0;
            synth.speak(utter);
          };
          if (!voicesReady()) setTimeout(start, 200); else start();
        }

        function slugify(text) {
          return String(text)
            .toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9\s-]/g, "")
            .trim()
            .replace(/\s+/g, "-")
            .replace(/-+/g, "-");
        }

        async function playRecordedOrTts(kind) {
          const { item } = currentItem();
          const text = kind === "da" ? (item.ctxDa || item.da) : (item.ctxRu || item.ru);
          const audioEl = kind === "da" ? $("audioDa") : $("audioRu");
          // Stop any current audio and TTS
          try { audioEl.pause(); audioEl.currentTime = 0; } catch {}
          if (window.speechSynthesis) window.speechSynthesis.cancel();

          const base = `audio`;
          const name = slugify(item.da);
          const fileCandidates = [
            `${base}/${name}-${kind}.mp3`,
            `${base}/${name}-${kind}.m4a`,
            `${base}/${name}-${kind}.ogg`,
            `${base}/${name}.mp3`,
            `${base}/${name}.m4a`,
            `${base}/${name}.ogg`
          ];

          // Try to probe files sequentially
          for (const url of fileCandidates) {
            try {
              // Attempt to load. Some browsers block local file fetch; we rely on onerror fallback too.
              audioEl.src = url;
              await audioEl.play();
              return; // success
            } catch (e) {
              // try next
            }
          }
          // fallback to TTS
          speak(text, kind, item.da);
        }

        $("btnSpeakDa").addEventListener("click", () => { playRecordedOrTts("da"); });
        $("btnSpeakRu").addEventListener("click", () => { playRecordedOrTts("ru"); });
        $("btnSpeakStop").addEventListener("click", () => {
          try { $("audioDa").pause(); $("audioRu").pause(); } catch {}
          if (window.speechSynthesis) window.speechSynthesis.cancel();
        });

        window.addEventListener("keydown", (e) => {
          if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
          if (e.code === "Space") { e.preventDefault(); setFlipped(!state.flipped); }
          if (e.key === "ArrowRight") { e.preventDefault(); nextCard(); }
          if (e.key === "ArrowLeft") { e.preventDefault(); prevCard(); }
          if (e.key === "1") { e.preventDefault(); markKnown(true); }
          if (e.key === "2") { e.preventDefault(); markKnown(false); }
        });
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
  </html>
