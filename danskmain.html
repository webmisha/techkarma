      * {

        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        height: 100%;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: none;
      }

      .container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .container::-webkit-scrollbar {
        display: none;
      }

      .card-slide {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1400px;
      }

      .card {
        position: relative;
        width: 90%;
        max-width: 500px;
        aspect-ratio: 9 / 16;
        transform-style: preserve-3d;
        transition: transform 600ms cubic-bezier(.2,.8,.2,1);
        cursor: pointer;
      }

      .card.is-flipped {
        transform: rotateY(180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border-radius: 24px;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }

      .face.back {
        transform: rotateY(180deg);
        background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
      }

      .top-bar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 20px;
      }

      .emoji {
        font-size: 40px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        margin-left: 8px;
      }

      .counter {
        background: rgba(255,255,255,0.15);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        backdrop-filter: blur(10px);
        letter-spacing: 0.02em;
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 20px;
      }

      .word-display {
        font-size: clamp(36px, 9vw, 56px);
        font-weight: 700;
        line-height: 1.1;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        letter-spacing: -0.03em;
      }

      .context {
        font-size: clamp(32px, 8vw, 48px);
        font-weight: 400;
        line-height: 1.3;
        opacity: 0.98;
        letter-spacing: -0.02em;
      }
      
      .context-emoji {
        font-size: clamp(20px, 5vw, 32px);
        margin-left: 8px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      }

      .mark {
        background: rgba(56, 189, 248, 0.35);
        color: #7dd3fc;
        padding: 4px 10px;
        border-radius: 8px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .translation {
        font-size: clamp(28px, 7vw, 42px);
        font-weight: 700;
        line-height: 1.3;
        margin-top: 20px;
        opacity: 0.98;
        letter-spacing: -0.02em;
      }

      .note {
        font-size: 16px;
        opacity: 0.7;
        line-height: 1.6;
        margin-top: 12px;
      }

      .mnemonic {
        font-size: clamp(18px, 4.5vw, 24px);
        font-weight: 600;
        line-height: 1.4;
        margin-top: 24px;
        padding: 16px 20px;
        background: rgba(255, 255, 255, 0.08);
        border-left: 3px solid rgba(253, 224, 71, 0.6);
        border-radius: 8px;
        color: #fef08a;
        opacity: 0.95;
        letter-spacing: -0.01em;
      }

      .hint {
        font-size: 14px;
        opacity: 0.6;
        text-align: center;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.3; }
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .audio-controls {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        z-index: 10;
      }

      .btn-audio {
        width: 52px;
        height: 52px;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.25);
        color: white;
        border-radius: 50%;
        font-size: 24px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }

      .btn-audio:active {
        transform: scale(0.9);
      }

      .btn-audio:hover {
        background: rgba(255,255,255,0.25);
      }

      /* Answer options */
      .answer-options {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 500px;
        margin: 20px auto 0;
      }

      .answer-btn {
        background: rgba(255,255,255,0.15);

        color: white;
        padding: 16px 20px;
        border-radius: 16px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.2s;
        text-align: center;
        user-select: none;
      }

      .answer-btn:hover {
        background: rgba(255,255,255,0.25);
        transform: translateY(-2px);
      }

      .answer-btn:active {
        transform: scale(0.98);
      }

      .answer-btn.correct {
        background: rgba(34, 197, 94, 0.3);
        border-color: rgba(34, 197, 94, 0.6);
        color: #86efac;
        font-weight: 600;
      }

      .answer-btn.incorrect {
        background: rgba(239, 68, 68, 0.3);
        border-color: rgba(239, 68, 68, 0.6);
        color: #fca5a5;
        font-weight: 600;
      }

      .answer-btn.disabled {
        cursor: not-allowed;
        opacity: 0.7;
      }

      .btn {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        padding: 12px 20px;
        border-radius: 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(10px);

      }

      .btn-error {

      }

      .btn-primary {
        background: rgba(56, 189, 248, 0.2);
        border-color: rgba(56, 189, 248, 0.4);
      }

      .sidebar {

        right: 16px;
        top: 50%;

        position: fixed;

        left: 20px;
        right: 20px;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
        z-index: 100;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #22c55e, #38bdf8);
        width: 0%;
        transition: width 0.3s ease;
      }

        .sidebar {

        }
        .sidebar-btn {
          width: 48px;
          height: 48px;
          font-size: 20px;
        }
        .top-stats {
          right: 70px;
        }
      }
    </style>

      function shuffle(array) {
        const a = array.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function highlightContext(text, target, emoji) {
        if (!text || !target) return text;
        const esc = target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const re = new RegExp(`(\\b${esc}\\b)`, "i");
        const emojiHtml = emoji ? ` <span class="emoji">${emoji}</span>` : '';
        return text.replace(re, `<span class="mark">$1</span>${emojiHtml}`);
      }

      function createCard(item, index, total) {
        const ctxHtml = highlightContext(item.ctxDa || item.da, item.da, item.emoji);
        const bgColor = getCardColor(item.emoji);
        
        // Generate answer options HTML if available
        let answersHtml = '';
        if (item.answers && item.answers.length > 0) {
          answersHtml = `
            <div class="answer-options">
              ${item.answers.map((answer, i) => `
                <button class="answer-btn" data-card-index="${index}" data-answer-index="${i}">
                  ${answer}
                </button>
              `).join('')}
            </div>
          `;
        }
        
        return `
          <div class="card-slide" data-index="${index}">
            <div class="card" data-index="${index}">
              <div class="face front" style="background: ${bgColor}">
                <div class="top-bar">
                </div>
                <div class="main-content">
                  <div class="context">${ctxHtml}</div>
                  ${answersHtml}
                </div>
                <div class="actions">

                <div class="audio-controls">
                  <button class="btn-audio speak-da-btn" data-index="${index}">🇩🇰</button>
                  <button class="btn-audio speak-ru-btn" data-index="${index}">🇷🇺</button>

              </div>
              <div class="face back" style="background: ${bgColor}; filter: brightness(0.85);">
                <div class="top-bar">
                </div>
                <div class="main-content">
                  <div class="word-display">
                    <span>${item.da}</span>
                    <span class="emoji">${item.emoji || "✨"}</span>
                  </div>
                  <div class="translation">${item.ru}</div>
                  ${item.mnemonic ? `<div class="mnemonic">💡 ${item.mnemonic}</div>` : ''}

                <div class="actions">
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderCards() {
        const total = state.order.length;
        const html = state.order.map((dataIndex, i) => 
          createCard(DATA[dataIndex], i, total)
        ).join('');
        container.innerHTML = html;

        // Add event listeners
        document.querySelectorAll('.card').forEach((card, index) => {
          card.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
              flipCard(card);
            }
          });
        });

        document.querySelectorAll('.speak-da-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(e.target.dataset.index);
            const dataIndex = state.order[index];
            const item = DATA[dataIndex];
            speak(item.ctxDa || item.da, 'da');
          });
        });

        document.querySelectorAll('.speak-ru-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(e.target.dataset.index);
            const dataIndex = state.order[index];
            const item = DATA[dataIndex];
            speak(item.ctxRu || item.ru, 'ru');
          });
        });

        // Add event listeners for answer buttons
        document.querySelectorAll('.answer-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            handleAnswer(e.target);
          });
        });

        updateStats();
      }

      function handleAnswer(btn) {
        const cardIndex = parseInt(btn.dataset.cardIndex);
        const answerIndex = parseInt(btn.dataset.answerIndex);
        const dataIndex = state.order[cardIndex];
        const item = DATA[dataIndex];
        
        // Get the card slide element
        const slide = btn.closest('.card-slide');
        if (!slide) return;
        
        // Get all answer buttons in this card
        const buttons = slide.querySelectorAll('.answer-btn');
        
        // Check if answer is correct
        const isCorrect = answerIndex === item.c;
        
        // Update button states
        buttons.forEach((button, i) => {
          button.classList.add('disabled');
          button.style.pointerEvents = 'none';
          
          if (i === item.c) {
            button.classList.add('correct');
          } else if (i === answerIndex && !isCorrect) {
            button.classList.add('incorrect');
          }
        });
        
        // Show feedback toast
        if (isCorrect) {
          showToast('✅ Правильно!');
        } else {
          showToast('❌ Неправильно');
        }
      }

      function flipCard(card) {
        card.classList.toggle('is-flipped');
      }

      function updateStats() {
        const total = DATA.length;
        const current = Math.floor(container.scrollTop / window.innerHeight) + 1;
        
        const progress = (current / total) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
      }

      function reset(doShuffle = true) {
        state.order = doShuffle ? shuffle([...DATA.keys()]) : [...DATA.keys()];
        state.currentIndex = 0;
        persist();
        renderCards();
        container.scrollTop = 0;
      }

      function persist() {
        try {
          localStorage.setItem(appStateKey, JSON.stringify({
            order: state.order,
            currentIndex: state.currentIndex
          }));
        } catch {}
      }

      function restore() {
        try {
          const raw = localStorage.getItem(appStateKey);
          if (!raw) return false;
          const obj = JSON.parse(raw);
          if (!Array.isArray(obj.order)) return false;
          state.order = obj.order.filter(x => x >= 0 && x < DATA.length);
          if (state.order.length !== DATA.length) return false;
          state.currentIndex = obj.currentIndex || 0;
          return true;
        } catch {
          return false;
        }
      }

      // Speech synthesis
        let voicesLoaded = false;
      let availableVoices = [];
        
        function loadVoices() {
        availableVoices = window.speechSynthesis.getVoices();
        if (availableVoices.length > 0) {
            voicesLoaded = true;
          console.log('Loaded voices:', availableVoices.map(v => `${v.name} (${v.lang})`));
          }
        }
        
      // Load voices on page load and when they change
      if (window.speechSynthesis) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
        
        // Also try loading after user interaction (iOS requirement)
          document.addEventListener('click', () => {
            setTimeout(loadVoices, 100);
          }, { once: true });
        }

      function selectBestVoice(lang) {
        if (!voicesLoaded || availableVoices.length === 0) {
          console.warn('No voices loaded yet');
          return null;
        }

        const langCode = lang === 'da' ? 'da' : 'ru';
        
        // Priority list of HIGH-QUALITY voice names for each language
        const danishVoices = [
          'sara', 'ida', 'christel', 'magnus', 'freja',  // macOS/iOS
          'google dansk', 'google danish',                // Android/Chrome
          'microsoft christel', 'dansk', 'danish', 'da-dk'
        ];
        const russianVoices = [
          'yuri', 'milena', 'katya', 'ekaterina',        // macOS/iOS
          'google русский', 'google russian',             // Android/Chrome  
          'microsoft ekaterina', 'russian', 'русский', 'ru-ru'
        ];
        
        const preferredNames = lang === 'da' ? danishVoices : russianVoices;
        
        // First, try to find voices that match the language code exactly
        const exactMatches = availableVoices.filter(v => 
          v.lang.toLowerCase().startsWith(langCode)
        );
        
        console.log(`Found ${exactMatches.length} voices for ${langCode}:`, 
          exactMatches.map(v => `${v.name} (${v.lang}) [${v.localService ? 'local' : 'remote'}]`));
        
        // Prefer local voices (they're usually higher quality)
        const localVoices = exactMatches.filter(v => v.localService);
        const remoteVoices = exactMatches.filter(v => !v.localService);
        
        // Try to find preferred voice by name (prioritize local)
        for (const prefName of preferredNames) {
          // First check local voices
          let voice = localVoices.find(v => 
            v.name.toLowerCase().includes(prefName)
          );
          if (voice) {
            console.log(`Selected local voice: ${voice.name} (${voice.lang})`);
            return voice;
          }
          
          // Then check remote voices
          voice = remoteVoices.find(v => 
            v.name.toLowerCase().includes(prefName)
          );
          if (voice) {
            console.log(`Selected remote voice: ${voice.name} (${voice.lang})`);
            return voice;
          }
        }
        
        // Fallback: prefer local voice if available
        if (localVoices.length > 0) {
          console.log(`Using fallback local voice: ${localVoices[0].name} (${localVoices[0].lang})`);
          return localVoices[0];
        }
        
        if (exactMatches.length > 0) {
          console.log(`Using fallback voice: ${exactMatches[0].name} (${exactMatches[0].lang})`);
          return exactMatches[0];
        }
        
        console.warn(`No ${langCode} voices found`);
            return null;
          }
          
      // Clean text for better speech quality
      function cleanTextForSpeech(text, lang) {
        if (!text) return text;
        
        let cleaned = text.trim();
        
        // Remove HTML tags if any
        cleaned = cleaned.replace(/<[^>]*>/g, '');
        
        // Normalize spaces
        cleaned = cleaned.replace(/\s+/g, ' ');
        
        // Add natural pauses for better prosody
        if (lang === 'da') {
          // Add pauses after Danish conjunctions
          cleaned = cleaned.replace(/([,;:])/g, '$1 ');
          cleaned = cleaned.replace(/\s+/g, ' ');
        } else if (lang === 'ru') {
          // Add pauses for Russian
          cleaned = cleaned.replace(/([,;:])/g, '$1 ');
          cleaned = cleaned.replace(/\s+/g, ' ');
        }
        
        // Ensure proper sentence ending
        if (!/[.!?…]$/.test(cleaned)) {
          cleaned += '.';
        }
        
        return cleaned;
      }

      function speak(text, lang) {
        if (!window.speechSynthesis || !text) {
          console.error('Speech synthesis not available');
          return;
        }
        
        const synth = window.speechSynthesis;
        
        // Cancel any ongoing speech smoothly
        if (synth.speaking) {
          synth.cancel();
        }
        
        // Wait for cancel to complete and voices to be ready
        setTimeout(() => {
          // Clean text for better quality
          const cleanedText = cleanTextForSpeech(text, lang);
          
          const utterance = new SpeechSynthesisUtterance(cleanedText);
            
            // Set language explicitly
          utterance.lang = lang === 'da' ? 'da-DK' : 'ru-RU';
          
          // Try to select best voice
          const voice = selectBestVoice(lang);
          if (voice) {
            utterance.voice = voice;
            console.log(`Speaking with voice: ${voice.name} (${voice.lang})`);
            } else { 
            console.warn(`No voice found for ${lang}, using default`);
          }
          
          // Optimized speech parameters for natural sound
          if (lang === 'da') {
            utterance.rate = 0.82;  // Slower for Danish
            utterance.pitch = 1.05; // Slightly higher pitch
            utterance.volume = 1.0;
          } else if (lang === 'ru') {
            utterance.rate = 0.88;  // Slower for Russian
            utterance.pitch = 0.98; // Slightly lower pitch
            utterance.volume = 1.0;
          }
          
          // Error handling
          utterance.onerror = (event) => {
            console.error('Speech error:', event.error, event);
            if (event.error !== 'canceled') {
              showToast('🔇 Ошибка воспроизведения');
            }
          };
          
          utterance.onstart = () => {
            console.log(`Started speaking: "${cleanedText.substring(0, 50)}..."`);
          };
          
          utterance.onend = () => {
            console.log('Finished speaking');
          };
          
          utterance.onpause = () => {
            console.log('Speech paused');
          };
          
          utterance.onresume = () => {
            console.log('Speech resumed');
          };
          
          // Resume audio context if needed (iOS fix)
          if (synth.paused) {
            synth.resume();
          }
          
          // Speak with error handling
          try {
            synth.speak(utterance);
            
            // iOS/Safari fix: resume after small delay
            setTimeout(() => {
              if (synth.paused) {
                synth.resume();
              }
            }, 100);
          } catch (error) {
            console.error('Failed to speak:', error);
            showToast('🔇 Не удалось воспроизвести');
          }
        }, 150);
      }

      function getCurrentCard() {
        const index = Math.floor(container.scrollTop / window.innerHeight);
        const dataIndex = state.order[index];
        return DATA[dataIndex];
      }

      function init() {
        container = document.getElementById('container');
        
        // Always shuffle cards on load for random order
        reset(true);

        // Update stats on scroll
        container.addEventListener('scroll', () => {
          updateStats();
        });

        // Sidebar controls
        document.getElementById('btnSpeakDa').addEventListener('click', () => {
          const card = getCurrentCard();
          if (card) speak(card.ctxDa || card.da, 'da');
        });

        document.getElementById('btnSpeakRu').addEventListener('click', () => {
          const card = getCurrentCard();
          if (card) speak(card.ctxRu || card.ru, 'ru');
        });

        // Initialize audio context on first interaction
        document.addEventListener('click', () => {
          if (!audioContextReady) {
            try {
              if (window.speechSynthesis) {
                window.speechSynthesis.resume();
              }
              audioContextReady = true;
            } catch {}
          }
        }, { once: true });
      }

      function showToast(message) {
        const toast = document.createElement('div');
        toast.textContent = message;
        toast.style.cssText = `
          position: fixed;
          bottom: 100px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(0,0,0,0.8);
          color: white;
          padding: 12px 24px;
          border-radius: 24px;
          z-index: 1000;
          backdrop-filter: blur(10px);
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      }

      document.addEventListener('DOMContentLoaded', () => {
        init();
      });
    </script>
  </body>
  </html>
