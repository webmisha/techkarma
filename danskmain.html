    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        height: 100%;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: none;
      }

      .container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .container::-webkit-scrollbar {
        display: none;
      }

      .card-slide {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1400px;
      }

      .card {
        position: relative;
        width: 90%;
        max-width: 500px;
        aspect-ratio: 9 / 16;
        transform-style: preserve-3d;
        transition: transform 600ms cubic-bezier(.2,.8,.2,1);
        cursor: pointer;
      }

      .card.is-flipped {
        transform: rotateY(180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border-radius: 24px;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }

      .face.back {
        transform: rotateY(180deg);
        background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
      }

      .top-bar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 20px;
      }

      .emoji {
        font-size: 32px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        margin-right: 8px;
      }

      .counter {
        background: rgba(255,255,255,0.15);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        backdrop-filter: blur(10px);
        letter-spacing: 0.02em;
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 20px;
      }

      .word-display {
        font-size: clamp(28px, 7vw, 42px);
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        letter-spacing: -0.02em;
      }

      .context {
        font-size: clamp(18px, 4.5vw, 24px);
        font-weight: 400;
        line-height: 1.6;
        opacity: 0.95;
        letter-spacing: -0.01em;
      }
      
      .context-emoji {
        font-size: clamp(20px, 5vw, 32px);
        margin-left: 8px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      }

      .mark {
        background: rgba(56, 189, 248, 0.3);
        color: #38bdf8;
        padding: 3px 8px;
        border-radius: 6px;
        font-weight: 600;
      }

      .translation {
        font-size: clamp(22px, 5.5vw, 32px);
        font-weight: 500;
        line-height: 1.4;
        margin-top: 20px;
        opacity: 0.95;
        letter-spacing: -0.01em;
      }

      .note {
        font-size: 16px;
        opacity: 0.7;
        line-height: 1.6;
        margin-top: 12px;
      }

      .hint {
        font-size: 14px;
        opacity: 0.6;
        text-align: center;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.3; }
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        padding: 12px 20px;
        border-radius: 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
        user-select: none;
      }

      .btn:active {
        transform: scale(0.95);
      }

      .btn-success {
        background: rgba(34, 197, 94, 0.2);
        border-color: rgba(34, 197, 94, 0.4);
      }

      .btn-error {
        background: rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.4);
      }

      .btn-primary {
        background: rgba(56, 189, 248, 0.2);
        border-color: rgba(56, 189, 248, 0.4);
      }

      /* Sidebar UI */
      .sidebar {
        position: fixed;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        display: none;
        flex-direction: column;
        gap: 20px;
        z-index: 100;
      }

      .sidebar-btn {
        width: 56px;
        height: 56px;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(10px);
        font-size: 24px;
        transition: all 0.2s;
      }

      .sidebar-btn:active {
        transform: scale(0.9);
      }

      .sidebar-label {
        font-size: 11px;
        text-align: center;
        margin-top: 4px;
        opacity: 0.8;
      }

      /* Top bar stats */
      .top-stats {
        position: fixed;
        top: env(safe-area-inset-top, 20px);
        top: calc(env(safe-area-inset-top, 0px) + 20px);
        left: 20px;
        right: 80px;
        z-index: 100;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .stat-pill {
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid rgba(255,255,255,0.1);
        letter-spacing: 0.02em;
      }

      /* Progress bar */
      .progress-bar {
        position: fixed;
        bottom: env(safe-area-inset-bottom, 20px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
        left: 20px;
        right: 20px;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
        z-index: 100;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #22c55e, #38bdf8);
        width: 0%;
        transition: width 0.3s ease;
      }

      @media (max-width: 640px) {
        .sidebar {

        }
        .sidebar-btn {
          width: 48px;
          height: 48px;
          font-size: 20px;
        }
        .top-stats {
          right: 70px;
        }
      }
    </style>
  </head>

          ru: "итак, то есть",
          note: "Bruges til at konkludere eller præcisere.",
          emoji: "💬",
          ctxDa: "Han kommer ikke, altså må vi begynde uden ham.",
          ctxRu: "Он не придёт, итак, мы должны начать без него."
        },
        {
          da: "forøge",
          ru: "увеличить, повысить",
          note: "At gøre noget større eller mere.",
          emoji: "📈",
          ctxDa: "Virksomheden vil forøge produktionen næste år.",
          ctxRu: "Компания увеличит производство в следующем году."
        },
        {
          da: "overtage",
          ru: "взять на себя, перенять",
          note: "At tage kontrol eller ansvar.",
          emoji: "🤝",
          ctxDa: "Hun overtager min stilling, når jeg stopper.",
          ctxRu: "Она возьмёт на себя мою должность, когда я уйду."
        },
        {
          da: "formålet",
          ru: "цель, назначение",
          note: "Den hensigt eller målsætning man har.",
          emoji: "🎯",
          ctxDa: "Formålet med mødet er at finde en løsning.",
          ctxRu: "Цель встречи — найти решение."
        },
        {
          da: "hensigten",
          ru: "намерение, цель",
          note: "Det man har til hensigt at gøre.",
          emoji: "💡",
          ctxDa: "Det var ikke min hensigt at såre dig.",
          ctxRu: "Я не намеревался обидеть тебя."
        },
        {
          da: "sandsynlig",
          ru: "вероятный, возможный",
          note: "Noget der med stor sandsynlighed vil ske.",
          emoji: "🎲",
          ctxDa: "Det er sandsynligt, at det regner i morgen.",
          ctxRu: "Вероятно, завтра будет дождь."
        },
        {
          da: "svækket",
          ru: "ослабленный",
          note: "Gjort svagere eller mindre stærk.",
          emoji: "📉",
          ctxDa: "Økonomien er blevet svækket af krisen.",
          ctxRu: "Экономика была ослаблена кризисом."
        },
        {
          da: "undersøgt",
          ru: "исследованный, изученный",
          note: "Noget der er blevet analyseret eller studeret.",
          emoji: "🔬",
          ctxDa: "Sagen er blevet grundigt undersøgt af politiet.",
          ctxRu: "Дело было тщательно изучено полицией."
        }
      ];

      const appStateKey = "dansk-trainer-tiktok-v1";
      const state = {
        order: [],
        currentIndex: 0
      };

      let container;
      let audioContextReady = false;

      function shuffle(array) {
        const a = array.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function highlightContext(text, target) {
        if (!text || !target) return text;
        const esc = target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const re = new RegExp(`(\\b${esc}\\b)`, "i");
        return text.replace(re, '<span class="mark">$1</span>');
      }

      function getCardColor(emoji) {
        const colorMap = {
          '➕': 'linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%)', // blue
          '⚠️': 'linear-gradient(135deg, #92400e 0%, #b45309 100%)', // orange/amber
          '⚖️': 'linear-gradient(135deg, #4c1d95 0%, #5b21b6 100%)', // purple
          '🔄': 'linear-gradient(135deg, #134e4a 0%, #115e59 100%)', // teal
          '📝': 'linear-gradient(135deg, #0f766e 0%, #0d9488 100%)', // teal
          '✨': 'linear-gradient(135deg, #7e22ce 0%, #9333ea 100%)', // purple
          '⏰': 'linear-gradient(135deg, #1e40af 0%, #2563eb 100%)', // blue
          '🔗': 'linear-gradient(135deg, #065f46 0%, #047857 100%)', // green
          '💡': 'linear-gradient(135deg, #ca8a04 0%, #eab308 100%)', // yellow
          '↔️': 'linear-gradient(135deg, #be123c 0%, #e11d48 100%)', // rose
          '🤔': 'linear-gradient(135deg, #6b21a8 0%, #7c3aed 100%)', // violet
          '💪': 'linear-gradient(135deg, #b91c1c 0%, #dc2626 100%)', // red
          '🏁': 'linear-gradient(135deg, #1f2937 0%, #374151 100%)', // gray
          '⏳': 'linear-gradient(135deg, #9f1239 0%, #be123c 100%)', // pink
          '📊': 'linear-gradient(135deg, #0c4a6e 0%, #075985 100%)', // sky
          '💬': 'linear-gradient(135deg, #15803d 0%, #16a34a 100%)', // green
          '💭': 'linear-gradient(135deg, #6d28d9 0%, #7c3aed 100%)', // violet
          '🎯': 'linear-gradient(135deg, #991b1b 0%, #b91c1c 100%)', // red
          '🤝': 'linear-gradient(135deg, #047857 0%, #059669 100%)', // emerald
          '📈': 'linear-gradient(135deg, #0369a1 0%, #0284c7 100%)', // sky
          '⭐': 'linear-gradient(135deg, #d97706 0%, #f59e0b 100%)', // amber
          '✅': 'linear-gradient(135deg, #15803d 0%, #16a34a 100%)', // green
          '🛡️': 'linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%)', // blue
          '🔍': 'linear-gradient(135deg, #6b21a8 0%, #7c3aed 100%)', // violet
          '🤷': 'linear-gradient(135deg, #475569 0%, #64748b 100%)', // slate
          '📋': 'linear-gradient(135deg, #0c4a6e 0%, #075985 100%)', // sky
          '🎊': 'linear-gradient(135deg, #be185d 0%, #db2777 100%)', // pink
          '🌐': 'linear-gradient(135deg, #0e7490 0%, #0891b2 100%)'  // cyan
        };
        return colorMap[emoji] || 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)';
      }

      function createCard(item, index, total) {
        const ctxHtml = highlightContext(item.ctxDa || item.da, item.da);
        const bgColor = getCardColor(item.emoji);
        
        return `
          <div class="card-slide" data-index="${index}">
            <div class="card" data-index="${index}">
              <div class="face front" style="background: ${bgColor}">
                <div class="top-bar">
                  <div class="counter">${index + 1} / ${total}</div>
                </div>
                <div class="main-content">
                  <div class="word-display">
                    <span>${item.da}</span>
                    <span class="emoji">${item.emoji || "✨"}</span>
                  </div>
                  <div class="context">${ctxHtml}</div>
                </div>
                <div class="actions">
                  <button class="btn btn-primary speak-da-btn" data-index="${index}">🇩🇰</button>
                  <button class="btn btn-primary flip-btn">🪄 Translate</button>
                  <button class="btn btn-primary speak-ru-btn" data-index="${index}">🇷🇺</button>
                </div>
              </div>
              <div class="face back" style="background: ${bgColor}; filter: brightness(0.85);">
                <div class="top-bar">
                  <div class="counter">${index + 1} / ${total}</div>
                </div>
                <div class="main-content">
                  <div class="word-display">
                    <span>${item.da}</span>
                    <span class="emoji">${item.emoji || "✨"}</span>
                  </div>
                  <div class="translation">${item.ru}</div>
                </div>
                <div class="actions">
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderCards() {
        const total = state.order.length;
        const html = state.order.map((dataIndex, i) => 
          createCard(DATA[dataIndex], i, total)
        ).join('');
        container.innerHTML = html;

        // Add event listeners
        document.querySelectorAll('.card').forEach((card, index) => {
          card.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
              flipCard(card);
            }
          });
        });

        document.querySelectorAll('.flip-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const card = e.target.closest('.card');
            flipCard(card);
          });
        });

        document.querySelectorAll('.speak-da-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(e.target.dataset.index);
            const dataIndex = state.order[index];
            const item = DATA[dataIndex];
            speak(item.ctxDa || item.da, 'da');
          });
        });

        document.querySelectorAll('.speak-ru-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(e.target.dataset.index);
            const dataIndex = state.order[index];
            const item = DATA[dataIndex];
            speak(item.ctxRu || item.ru, 'ru');
          });
        });

        updateStats();
      }

      function flipCard(card) {
        card.classList.toggle('is-flipped');
      }

      function updateStats() {
        const total = DATA.length;
        const current = Math.floor(container.scrollTop / window.innerHeight) + 1;
        
        document.getElementById('totalCount').textContent = `${total} карточек`;
        document.getElementById('progressText').textContent = `${current}/${state.order.length}`;
        
        const progress = (current / total) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
      }

      function reset(doShuffle = true) {
        state.order = doShuffle ? shuffle([...DATA.keys()]) : [...DATA.keys()];
        state.currentIndex = 0;
        persist();
        renderCards();
        container.scrollTop = 0;
      }

      function persist() {
        try {
          localStorage.setItem(appStateKey, JSON.stringify({
            order: state.order,
            currentIndex: state.currentIndex
          }));
        } catch {}
      }

      function restore() {
        try {
          const raw = localStorage.getItem(appStateKey);
          if (!raw) return false;
          const obj = JSON.parse(raw);
          if (!Array.isArray(obj.order)) return false;
          state.order = obj.order.filter(x => x >= 0 && x < DATA.length);
          if (state.order.length !== DATA.length) return false;
          state.currentIndex = obj.currentIndex || 0;
          return true;
        } catch {
          return false;
        }
      }

      // Speech synthesis
        let voicesLoaded = false;
      let availableVoices = [];
        
        function loadVoices() {
        availableVoices = window.speechSynthesis.getVoices();
        if (availableVoices.length > 0) {
            voicesLoaded = true;
          console.log('Loaded voices:', availableVoices.map(v => `${v.name} (${v.lang})`));
          }
        }
        
      // Load voices on page load and when they change
      if (window.speechSynthesis) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
        
        // Also try loading after user interaction (iOS requirement)
          document.addEventListener('click', () => {
            setTimeout(loadVoices, 100);
          }, { once: true });
        }

      function selectBestVoice(lang) {
        if (!voicesLoaded || availableVoices.length === 0) {
          console.warn('No voices loaded yet');
            return null;
          }
          
        const langCode = lang === 'da' ? 'da' : 'ru';
        
        // Priority list of voice names for each language
        const danishVoices = ['sara', 'ida', 'christel', 'dansk', 'danish', 'da-dk'];
        const russianVoices = ['yuri', 'milena', 'katya', 'ekaterina', 'russian', 'русский', 'ru-ru'];
        
        const preferredNames = lang === 'da' ? danishVoices : russianVoices;
        
        // First, try to find voices that match the language code exactly
        const exactMatches = availableVoices.filter(v => 
          v.lang.toLowerCase().startsWith(langCode)
        );
        
        console.log(`Found ${exactMatches.length} voices for ${langCode}:`, 
          exactMatches.map(v => `${v.name} (${v.lang})`));
        
        // Try to find preferred voice by name
        for (const prefName of preferredNames) {
          const voice = exactMatches.find(v => 
            v.name.toLowerCase().includes(prefName)
          );
          if (voice) {
            console.log(`Selected preferred voice: ${voice.name} (${voice.lang})`);
            return voice;
          }
        }
        
        // Fallback: use first exact match
        if (exactMatches.length > 0) {
          console.log(`Using fallback voice: ${exactMatches[0].name} (${exactMatches[0].lang})`);
          return exactMatches[0];
        }
        
        console.warn(`No ${langCode} voices found`);
        return null;
      }

      function speak(text, lang) {
        if (!window.speechSynthesis || !text) {
          console.error('Speech synthesis not available');
          return;
        }
        
        const synth = window.speechSynthesis;
        
        // Cancel any ongoing speech
          synth.cancel();
          
        // Wait a bit for cancel to complete
        setTimeout(() => {
          const utterance = new SpeechSynthesisUtterance(text);
          
          // Set language
          utterance.lang = lang === 'da' ? 'da-DK' : 'ru-RU';
          
          // Try to select best voice
          const voice = selectBestVoice(lang);
          if (voice) {
            utterance.voice = voice;
            console.log(`Speaking with voice: ${voice.name} (${voice.lang})`);
            } else { 
            console.warn(`No voice found for ${lang}, using default`);
          }
          
          // Set speech parameters
          utterance.rate = lang === 'da' ? 0.85 : 0.90;
          utterance.pitch = 1.0;
          utterance.volume = 1.0;
          
          // Error handling
          utterance.onerror = (event) => {
            console.error('Speech error:', event.error);
            showToast('🔇 Ошибка воспроизведения');
          };
          
          utterance.onstart = () => {
            console.log(`Started speaking: "${text.substring(0, 50)}..."`);
          };
          
          utterance.onend = () => {
            console.log('Finished speaking');
          };
          
          // Speak
          try {
            synth.speak(utterance);
          } catch (error) {
            console.error('Failed to speak:', error);
            showToast('🔇 Не удалось воспроизвести');
          }
        }, 100);
      }

      function getCurrentCard() {
        const index = Math.floor(container.scrollTop / window.innerHeight);
        const dataIndex = state.order[index];
        return DATA[dataIndex];
      }

      function init() {
        container = document.getElementById('container');
        
        const restored = restore();
        if (!restored) reset(true);
        else renderCards();

        // Update stats on scroll
        container.addEventListener('scroll', () => {
          updateStats();
        });

        // Sidebar controls
        document.getElementById('btnSpeakDa').addEventListener('click', () => {
          const card = getCurrentCard();
          if (card) speak(card.ctxDa || card.da, 'da');
        });

        document.getElementById('btnSpeakRu').addEventListener('click', () => {
          const card = getCurrentCard();
          if (card) speak(card.ctxRu || card.ru, 'ru');
        });

        // Initialize audio context on first interaction
        document.addEventListener('click', () => {
          if (!audioContextReady) {
            try {
              if (window.speechSynthesis) {
                window.speechSynthesis.resume();
              }
              audioContextReady = true;
            } catch {}
          }
        }, { once: true });
      }

      function showToast(message) {
        const toast = document.createElement('div');
        toast.textContent = message;
        toast.style.cssText = `
          position: fixed;
          bottom: 100px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(0,0,0,0.8);
          color: white;
          padding: 12px 24px;
          border-radius: 24px;
          z-index: 1000;
          backdrop-filter: blur(10px);
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      }

      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
