<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>История Дании • Тест</title>
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        height: 100%;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: none;
      }

      .container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .container::-webkit-scrollbar {
        display: none;
      }

      .card-slide {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1400px;
      }

      .card {
        position: relative;
        width: 90%;
        max-width: 500px;
        aspect-ratio: 9 / 16;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border-radius: 24px;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }

      .question-number {
        background: rgba(255,255,255,0.15);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        backdrop-filter: blur(10px);
        letter-spacing: 0.02em;
        text-align: center;
        margin-bottom: 20px;
      }

      .question-text {
        font-size: clamp(24px, 6vw, 32px);
        font-weight: 400;
        line-height: 1.4;
        opacity: 0.98;
        letter-spacing: -0.02em;
        margin-bottom: 30px;
        flex: 1;
        display: flex;
        align-items: center;
        text-align: center;
      }

      .answers {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      .answer-btn {
        background: rgba(255,255,255,0.15);
        border: 2px solid rgba(255,255,255,0.2);
        color: white;
        padding: 16px 20px;
        border-radius: 16px;
        font-size: clamp(16px, 4vw, 20px);
        font-weight: 500;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.3s;
        user-select: none;
        text-align: left;
        letter-spacing: -0.01em;
      }

      .answer-btn:active {
        transform: scale(0.98);
      }

      .answer-btn.correct {
        background: rgba(34, 197, 94, 0.3);
        border-color: rgba(34, 197, 94, 0.6);
        color: #86efac;
        font-weight: 600;
      }

      .answer-btn.incorrect {
        background: rgba(239, 68, 68, 0.3);
        border-color: rgba(239, 68, 68, 0.6);
        color: #fca5a5;
        font-weight: 600;
      }

      .answer-btn.disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      /* Timer */
      .timer-container {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .timer-display {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.2);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 12px 20px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #ffffff;
        min-width: 120px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .timer-display.running {
        background: rgba(34, 197, 94, 0.2);
        border-color: rgba(34, 197, 94, 0.4);
        color: #86efac;
      }

      .timer-display.finished {
        background: rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.4);
        color: #fca5a5;
        animation: pulse-timer 1s ease-in-out infinite;
      }

      @keyframes pulse-timer {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }

      .timer-controls {
        display: flex;
        gap: 8px;
      }

      .timer-btn {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.2s;
        user-select: none;
        flex: 1;
      }

      .timer-btn:active {
        transform: scale(0.95);
      }

      .timer-btn.start {
        background: rgba(34, 197, 94, 0.2);
        border-color: rgba(34, 197, 94, 0.4);
      }

      .timer-btn.reset {
        background: rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.4);
      }

      /* Progress bar */
      .progress-bar {
        position: fixed;
        bottom: env(safe-area-inset-bottom, 20px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
        left: 20px;
        right: 20px;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
        z-index: 100;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #22c55e, #38bdf8);
        width: 0%;
        transition: width 0.3s ease;
      }

      @media (max-width: 640px) {
        .card {
          padding: 24px 20px;
        }
        .question-text {
          font-size: clamp(20px, 5vw, 28px);
        }
        .answer-btn {
          padding: 14px 16px;
          font-size: clamp(14px, 3.5vw, 18px);
        }
      }
    </style>
  </head>

        {q: "Hvor mange mennesker bor der cirka i Danmark (ifølge 2025-kilden)?", a: ["Cirka 4,5 millioner", "Cirka 6 millioner", "Cirka 7 millioner"], c: 1},
        {q: "Hvor mange mennesker bor cirka i hovedstadsområdet?", a: ["Cirka 1 million", "Cirka 1,5 millioner", "Cirka 2 millioner"], c: 2},
        {q: "Hvad er Danmarks næststørste by?", a: ["Odense", "Aarhus", "Aalborg"], c: 1}
      ];

      const state = {
        order: [],
        currentIndex: 0,
        answered: []
      };

      let container;

      function shuffle(array) {
        const a = array.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function createCard(item, index, total) {
        const answersHtml = item.a.map((answer, i) => 
          `<button class="answer-btn" data-index="${index}" data-answer="${i}">${answer}</button>`
        ).join('');
        
        return `
          <div class="card-slide" data-index="${index}">
            <div class="card">
              <div class="question-number">${index + 1} / ${total}</div>
              <div class="question-text">${item.q}</div>
              <div class="answers">
                ${answersHtml}
              </div>
            </div>
          </div>
        `;
      }

      function renderCards() {
        const total = state.order.length;
        const html = state.order.map((dataIndex, i) => 
          createCard(DATA[dataIndex], i, total)
        ).join('');
        container.innerHTML = html;

        // Add event listeners for answers
        document.querySelectorAll('.answer-btn').forEach(btn => {
          btn.addEventListener('click', handleAnswer);
        });

        updateStats();
      }

      function handleAnswer(e) {
        const cardIndex = parseInt(e.target.dataset.index);
        const answerIndex = parseInt(e.target.dataset.answer);
        const dataIndex = state.order[cardIndex];
        const question = DATA[dataIndex];
        
        // Mark as answered
        if (state.answered[cardIndex]) return;
        state.answered[cardIndex] = true;

        // Get all answer buttons for this card
        const slide = e.target.closest('.card-slide');
        const buttons = slide.querySelectorAll('.answer-btn');

        // Check if answer is correct
        const isCorrect = answerIndex === question.c;

        buttons.forEach((btn, i) => {
          btn.classList.add('disabled');
          if (i === question.c) {
            btn.classList.add('correct');
          } else if (i === answerIndex && !isCorrect) {
            btn.classList.add('incorrect');
          }
        });

        // Show toast
        if (isCorrect) {
          showToast('✅ Правильно!');
        } else {
          showToast('❌ Неправильно');
        }
      }

      function updateStats() {
        const total = DATA.length;
        const current = Math.floor(container.scrollTop / window.innerHeight) + 1;
        
        const progress = (current / total) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
      }

      function reset() {
        state.order = shuffle([...DATA.keys()]);
        state.currentIndex = 0;
        state.answered = [];
        renderCards();
        container.scrollTop = 0;
      }

      function init() {
        container = document.getElementById('container');
        
        // Always shuffle cards on load
        reset();

        // Update stats on scroll
        container.addEventListener('scroll', () => {
          updateStats();
        });
      }

      function showToast(message) {
        const toast = document.createElement('div');
        toast.textContent = message;
        toast.style.cssText = `
          position: fixed;
          bottom: 100px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(0,0,0,0.8);
          color: white;
          padding: 12px 24px;
          border-radius: 24px;
          z-index: 1000;
          backdrop-filter: blur(10px);
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      }

      // Timer functionality
      let timerInterval = null;
      let timeRemaining = 5 * 60;
      let isTimerRunning = false;
      const TIMER_DURATION = 5 * 60;

      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }

      function updateTimerDisplay() {
        const display = document.getElementById('timerDisplay');
        display.textContent = formatTime(timeRemaining);
        
        if (timeRemaining === 0) {
          display.classList.add('finished');
          display.classList.remove('running');
        } else if (isTimerRunning) {
          display.classList.add('running');
          display.classList.remove('finished');
        } else {
          display.classList.remove('running', 'finished');
        }
      }

      function playAlarmSound() {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99];
        
        notes.forEach((freq, index) => {
          setTimeout(() => {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = freq;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.8);
          }, index * 300);
        });
        
        showToast('⏰ Время истекло!');
      }

      function startTimer() {
        if (isTimerRunning) {
          clearInterval(timerInterval);
          isTimerRunning = false;
          document.getElementById('timerStart').textContent = '▶';
          updateTimerDisplay();
          return;
        }

        if (timeRemaining === 0) {
          timeRemaining = TIMER_DURATION;
        }

        isTimerRunning = true;
        document.getElementById('timerStart').textContent = '⏸';
        
        timerInterval = setInterval(() => {
          timeRemaining--;
          updateTimerDisplay();
          
          if (timeRemaining === 0) {
            clearInterval(timerInterval);
            isTimerRunning = false;
            document.getElementById('timerStart').textContent = '▶';
            playAlarmSound();
          }
        }, 1000);
      }

      function resetTimer() {
        clearInterval(timerInterval);
        isTimerRunning = false;
        timeRemaining = TIMER_DURATION;
        document.getElementById('timerStart').textContent = '▶';
        updateTimerDisplay();
      }

      function initTimer() {
        document.getElementById('timerStart').addEventListener('click', startTimer);
        document.getElementById('timerReset').addEventListener('click', resetTimer);
        updateTimerDisplay();
      }

      document.addEventListener('DOMContentLoaded', () => {
        init();
        initTimer();
      });
    </script>
  </body>
</html>
