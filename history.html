<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>История Дании • Тест</title>
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        height: 100%;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: none;
      }

      .container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .container::-webkit-scrollbar {
        display: none;
      }

      .card-slide {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1400px;
      }

      .card {
        position: relative;
        width: 90%;
        max-width: 500px;
        aspect-ratio: 9 / 16;
        transform-style: preserve-3d;
        transition: transform 600ms cubic-bezier(.2,.8,.2,1);
        cursor: pointer;
      }

      .card.is-flipped {
        transform: rotateY(180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border-radius: 24px;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }

      .face.back {
        transform: rotateY(180deg);
        background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
      }

      .question-number {
        display: none;
      }

      .question-text {
        font-size: clamp(24px, 6vw, 32px);
        font-weight: 400;
        line-height: 1.4;
        opacity: 0.98;
        letter-spacing: -0.02em;
        margin-bottom: 30px;
        flex: 1;
        display: flex;
        align-items: center;
        text-align: center;
      }

      .answers {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      .answer-btn {
        background: rgba(255,255,255,0.15);
        border: 2px solid rgba(255,255,255,0.2);
        color: white;
        padding: 16px 20px;
        border-radius: 16px;
        font-size: clamp(16px, 4vw, 20px);
        font-weight: 500;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.3s;
        user-select: none;
        text-align: left;
        letter-spacing: -0.01em;
      }

      .answer-btn:active {
        transform: scale(0.98);
      }

      .answer-btn.correct {
        background: rgba(34, 197, 94, 0.3);
        border-color: rgba(34, 197, 94, 0.6);
        color: #86efac;
        font-weight: 600;
      }

      .answer-btn.incorrect {
        background: rgba(239, 68, 68, 0.3);
        border-color: rgba(239, 68, 68, 0.6);
        color: #fca5a5;
        font-weight: 600;
      }

      .answer-btn.disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      /* Translation on back side */
      .translation {
        font-size: clamp(24px, 6vw, 32px);
        font-weight: 700;
        line-height: 1.3;
        opacity: 0.98;
        letter-spacing: -0.02em;
        text-align: center;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Audio controls */
      .audio-controls {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        z-index: 10;
      }

      .btn-audio {
        width: 52px;
        height: 52px;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.25);
        color: white;
        border-radius: 50%;
        font-size: 24px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }

      .btn-audio:active {
        transform: scale(0.9);
      }

      .btn-audio:hover {
        background: rgba(255,255,255,0.25);
      }

      /* Progress bar */
      .progress-bar {
        position: fixed;
        bottom: env(safe-area-inset-bottom, 20px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
        left: 20px;
        right: 20px;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
        z-index: 100;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #22c55e, #38bdf8);
        width: 0%;
        transition: width 0.3s ease;
      }

      @media (max-width: 640px) {
        .card {
          padding: 24px 20px;
        }
        .question-text {
          font-size: clamp(20px, 5vw, 28px);
        }
        .answer-btn {
          padding: 14px 16px;
          font-size: clamp(14px, 3.5vw, 18px);
        }
      }
    </style>
  </head>

        {q: "Hvor mange mennesker bor der cirka i Danmark (ifølge 2025-kilden)?", ru: "Сколько примерно людей живёт в Дании (согласно источнику 2025 года)?", a: ["Cirka 4,5 millioner", "Cirka 6 millioner", "Cirka 7 millioner"], c: 1},
        {q: "Hvor mange mennesker bor cirka i hovedstadsområdet?", ru: "Сколько примерно людей живёт в столичной области?", a: ["Cirka 1 million", "Cirka 1,5 millioner", "Cirka 2 millioner"], c: 2},
        {q: "Hvad er Danmarks næststørste by?", ru: "Какой второй по величине город Дании?", a: ["Odense", "Aarhus", "Aalborg"], c: 1}
      ];

      const state = {
        order: [],
        currentIndex: 0,
        answered: []
      };

      let container;

      function shuffle(array) {
        const a = array.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function createCard(item, index, total) {
        const answersHtml = item.a.map((answer, i) => 
          `<button class="answer-btn" data-index="${index}" data-answer="${i}">${answer}</button>`
        ).join('');
        
        // Get the Russian translation for the back side
        const russianTranslation = item.ru || "Перевод отсутствует";
        
        return `
          <div class="card-slide" data-index="${index}">
            <div class="card" data-index="${index}">
              <div class="face front">
                <div class="question-number">${index + 1} / ${total}</div>
                <div class="question-text">${item.q}</div>
                <div class="answers">
                  ${answersHtml}
                </div>
                <div class="audio-controls">
                  <button class="btn-audio speak-da-btn" data-index="${index}">🇩🇰</button>
                  <button class="btn-audio speak-ru-btn" data-index="${index}">🇷🇺</button>
                </div>
              </div>
              <div class="face back">
                <div class="question-text">${item.q}</div>
                <div class="translation">${russianTranslation}</div>
                <div class="audio-controls">
                  <button class="btn-audio speak-da-btn" data-index="${index}">🇩🇰</button>
                  <button class="btn-audio speak-ru-btn" data-index="${index}">🇷🇺</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderCards() {
        const total = state.order.length;
        const html = state.order.map((dataIndex, i) => 
          createCard(DATA[dataIndex], i, total)
        ).join('');
        container.innerHTML = html;

        // Add event listeners for card flip
        document.querySelectorAll('.card').forEach((card, index) => {
          card.addEventListener('click', (e) => {
            // Don't flip if clicking on a button
            if (e.target.tagName !== 'BUTTON') {
              flipCard(card);
            }
          });
        });

        // Add event listeners for answers
        document.querySelectorAll('.answer-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            handleAnswer(e.target);
          });
        });

        // Add event listeners for audio buttons
        document.querySelectorAll('.speak-da-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(btn.dataset.index);
            const dataIndex = state.order[index];
            const item = DATA[dataIndex];
            speak(item.q, 'da');
          });
        });

        document.querySelectorAll('.speak-ru-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(btn.dataset.index);
            const dataIndex = state.order[index];
            const item = DATA[dataIndex];
            // For Russian, speak the translation if available
            const russianText = item.ru || item.a[item.c];
            speak(russianText, 'ru');
          });
        });

        updateStats();
      }

      function handleAnswer(e) {
        const cardIndex = parseInt(e.target.dataset.index);
        const answerIndex = parseInt(e.target.dataset.answer);
        const dataIndex = state.order[cardIndex];
        const question = DATA[dataIndex];
        
        // Mark as answered
        if (state.answered[cardIndex]) return;
        state.answered[cardIndex] = true;

        // Get all answer buttons for this card
        const slide = e.target.closest('.card-slide');
        const buttons = slide.querySelectorAll('.answer-btn');

        // Check if answer is correct
        const isCorrect = answerIndex === question.c;

        buttons.forEach((btn, i) => {
          btn.classList.add('disabled');
          if (i === question.c) {
            btn.classList.add('correct');
          } else if (i === answerIndex && !isCorrect) {
            btn.classList.add('incorrect');
          }
        });

        // Show toast
        if (isCorrect) {
          showToast('✅ Правильно!');
        } else {
          showToast('❌ Неправильно');
        }
      }

      function flipCard(card) {
        card.classList.toggle('is-flipped');
      }

      function updateStats() {
        const total = DATA.length;
        const current = Math.floor(container.scrollTop / window.innerHeight) + 1;
        
        const progress = (current / total) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
      }

      function reset() {
        state.order = shuffle([...DATA.keys()]);
        state.currentIndex = 0;
        state.answered = [];
        renderCards();
        container.scrollTop = 0;
      }

      // Speech synthesis
      let voicesLoaded = false;
      let availableVoices = [];
      
      function loadVoices() {
        availableVoices = window.speechSynthesis.getVoices();
        if (availableVoices.length > 0) {
          voicesLoaded = true;
          console.log('Loaded voices:', availableVoices.map(v => `${v.name} (${v.lang})`));
        }
      }
      
      // Load voices on page load and when they change
      if (window.speechSynthesis) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
        
        // Also try loading after user interaction (iOS requirement)
        document.addEventListener('click', () => {
          setTimeout(loadVoices, 100);
        }, { once: true });
      }

      function selectBestVoice(lang) {
        if (!voicesLoaded || availableVoices.length === 0) {
          console.warn('No voices loaded yet');
          return null;
        }

        const langCode = lang === 'da' ? 'da' : 'ru';
        
        // Priority list of HIGH-QUALITY voice names for each language
        const danishVoices = [
          'sara', 'ida', 'christel', 'magnus', 'freja',  // macOS/iOS
          'google dansk', 'google danish',                // Android/Chrome
          'microsoft christel', 'dansk', 'danish', 'da-dk'
        ];
        const russianVoices = [
          'yuri', 'milena', 'katya', 'ekaterina',        // macOS/iOS
          'google русский', 'google russian',             // Android/Chrome  
          'microsoft ekaterina', 'russian', 'русский', 'ru-ru'
        ];
        
        const preferredNames = lang === 'da' ? danishVoices : russianVoices;
        
        // First, try to find voices that match the language code exactly
        const exactMatches = availableVoices.filter(v => 
          v.lang.toLowerCase().startsWith(langCode)
        );
        
        console.log(`Found ${exactMatches.length} voices for ${langCode}:`, 
          exactMatches.map(v => `${v.name} (${v.lang}) [${v.localService ? 'local' : 'remote'}]`));
        
        // Prefer local voices (they're usually higher quality)
        const localVoices = exactMatches.filter(v => v.localService);
        const remoteVoices = exactMatches.filter(v => !v.localService);
        
        // Try to find preferred voice by name (prioritize local)
        for (const prefName of preferredNames) {
          // First check local voices
          let voice = localVoices.find(v => 
            v.name.toLowerCase().includes(prefName)
          );
          if (voice) {
            console.log(`Selected local voice: ${voice.name} (${voice.lang})`);
            return voice;
          }
          
          // Then check remote voices
          voice = remoteVoices.find(v => 
            v.name.toLowerCase().includes(prefName)
          );
          if (voice) {
            console.log(`Selected remote voice: ${voice.name} (${voice.lang})`);
            return voice;
          }
        }
        
        // Fallback: prefer local voice if available
        if (localVoices.length > 0) {
          console.log(`Using fallback local voice: ${localVoices[0].name} (${localVoices[0].lang})`);
          return localVoices[0];
        }
        
        if (exactMatches.length > 0) {
          console.log(`Using fallback voice: ${exactMatches[0].name} (${exactMatches[0].lang})`);
          return exactMatches[0];
        }
        
        console.warn(`No ${langCode} voices found`);
        return null;
      }
      
      // Clean text for better speech quality
      function cleanTextForSpeech(text, lang) {
        if (!text) return text;
        
        let cleaned = text.trim();
        
        // Remove HTML tags if any
        cleaned = cleaned.replace(/<[^>]*>/g, '');
        
        // Normalize spaces
        cleaned = cleaned.replace(/\s+/g, ' ');
        
        // Add natural pauses for better prosody
        if (lang === 'da') {
          // Add pauses after Danish conjunctions
          cleaned = cleaned.replace(/([,;:])/g, '$1 ');
          cleaned = cleaned.replace(/\s+/g, ' ');
        } else if (lang === 'ru') {
          // Add pauses for Russian
          cleaned = cleaned.replace(/([,;:])/g, '$1 ');
          cleaned = cleaned.replace(/\s+/g, ' ');
        }
        
        // Ensure proper sentence ending
        if (!/[.!?…]$/.test(cleaned)) {
          cleaned += '.';
        }
        
        return cleaned;
      }

      function speak(text, lang) {
        if (!window.speechSynthesis || !text) {
          console.error('Speech synthesis not available');
          return;
        }
        
        const synth = window.speechSynthesis;
        
        // Cancel any ongoing speech smoothly
        if (synth.speaking) {
          synth.cancel();
        }
        
        // Wait for cancel to complete and voices to be ready
        setTimeout(() => {
          // Clean text for better quality
          const cleanedText = cleanTextForSpeech(text, lang);
          
          const utterance = new SpeechSynthesisUtterance(cleanedText);
          
          // Set language explicitly
          utterance.lang = lang === 'da' ? 'da-DK' : 'ru-RU';
          
          // Try to select best voice
          const voice = selectBestVoice(lang);
          if (voice) {
            utterance.voice = voice;
            console.log(`Speaking with voice: ${voice.name} (${voice.lang})`);
          } else { 
            console.warn(`No voice found for ${lang}, using default`);
          }
          
          // Optimized speech parameters for natural sound
          if (lang === 'da') {
            utterance.rate = 0.82;  // Slower for Danish
            utterance.pitch = 1.05; // Slightly higher pitch
            utterance.volume = 1.0;
          } else if (lang === 'ru') {
            utterance.rate = 0.88;  // Slower for Russian
            utterance.pitch = 0.98; // Slightly lower pitch
            utterance.volume = 1.0;
          }
          
          // Error handling
          utterance.onerror = (event) => {
            console.error('Speech error:', event.error, event);
            if (event.error !== 'canceled') {
              showToast('🔇 Ошибка воспроизведения');
            }
          };
          
          utterance.onstart = () => {
            console.log(`Started speaking: "${cleanedText.substring(0, 50)}..."`);
          };
          
          utterance.onend = () => {
            console.log('Finished speaking');
          };
          
          utterance.onpause = () => {
            console.log('Speech paused');
          };
          
          utterance.onresume = () => {
            console.log('Speech resumed');
          };
          
          // Resume audio context if needed (iOS fix)
          if (synth.paused) {
            synth.resume();
          }
          
          // Speak with error handling
          try {
            synth.speak(utterance);
            
            // iOS/Safari fix: resume after small delay
            setTimeout(() => {
              if (synth.paused) {
                synth.resume();
              }
            }, 100);
          } catch (error) {
            console.error('Failed to speak:', error);
            showToast('🔇 Не удалось воспроизвести');
          }
        }, 150);
      }

      function getCurrentQuestion() {
        const index = Math.floor(container.scrollTop / window.innerHeight);
        const dataIndex = state.order[index];
        return DATA[dataIndex];
      }

      function init() {
        container = document.getElementById('container');
        
        // Always shuffle cards on load
        reset();

        // Update stats on scroll
        container.addEventListener('scroll', () => {
          updateStats();
        });
      }

      function showToast(message) {
        const toast = document.createElement('div');
        toast.textContent = message;
        toast.style.cssText = `
          position: fixed;
          bottom: 100px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(0,0,0,0.8);
          color: white;
          padding: 12px 24px;
          border-radius: 24px;
          z-index: 1000;
          backdrop-filter: blur(10px);
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      }

      document.addEventListener('DOMContentLoaded', () => {
        init();
      });
    </script>
